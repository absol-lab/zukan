<script>
/* ================= import / export ================= */
function mergeDataInto(local, incoming){
  const inc = normalizeData(incoming);
  const localMax = sbMaxUpdated(local), incMax = sbMaxUpdated(inc);
  inc.sections.forEach(s=>{ if(local.sections.indexOf(s)<0) local.sections.push(s); });
  inc.artists.forEach(ia=>{
    let ix = -1;
    if(ia.id!=null) ix = local.artists.findIndex(a=>String(a.id)===String(ia.id) && a.name===ia.name);
    if(ix<0) ix = local.artists.findIndex(a=>a.name===ia.name);
    if(ix<0){ local.artists.push(ia); return; }
    const la = local.artists[ix];
    const merged = Object.assign({}, la);
    ['name','name_latin','name_native','years','field','section','relation','key_works','notes','work_image','work_caption','layer','updated_at'].forEach(k=>{
      if(ia[k]) merged[k] = ia[k];
    });
    if(ia.tags && ia.tags.length) merged.tags = ia.tags;
    /* works merged by file key / fileId / url / caption — a work is registered
       under every key it has, so the same work dedupes across sources whose
       representations differ (e.g. local file key vs. remote img.url) */
    const wm = new Map();
    const wkeys = w=>[ (w.img&&w.img.fileId), w.file, (w.img&&w.img.url), ('cap:'+w.caption) ].filter(Boolean);
    (la.works||[]).forEach(w=>{ wkeys(w).forEach(k=>{ if(!wm.has(k)) wm.set(k, w); }); });
    (ia.works||[]).forEach(w=>{
      let ex = null;
      wkeys(w).some(k=>{ if(wm.has(k)){ ex = wm.get(k); return true; } return false; });
      if(ex){ if(w.caption) ex.caption = w.caption; if(w.img){ /* img upgrade: union of both sides (keep local fileId, adopt incoming url, etc.) */ ex.img = normalizeImg(Object.assign({}, ex.img||{}, w.img)) || ex.img || w.img; } wkeys(w).forEach(k=>wm.set(k, ex)); }
      else wkeys(w).forEach(k=>wm.set(k, w));
    });
    merged.works = Array.from(new Set(wm.values()));
    local.artists[ix] = normalizeArtist(merged);
  });
  if(inc.exhibitions && inc.exhibitions.length){
    const em = new Map();
    (local.exhibitions||[]).forEach(e=>em.set((e.title||'')+'|'+(e.start_date||''), e));
    inc.exhibitions.forEach(e=>em.set((e.title||'')+'|'+(e.start_date||''), e));
    local.exhibitions = Array.from(em.values());
  }
  /* timeline / quiz: root-level dataset parts; prefer the incoming copy when its data is at least as new */
  if(inc.timeline && (local.timeline==null || incMax >= localMax)) local.timeline = inc.timeline;
  if(quizHasData(inc.quiz) && (!quizHasData(local.quiz) || incMax >= localMax)) local.quiz = inc.quiz;
  return local;
}
async function importFile(input){
  const file = input.files && input.files[0]; input.value = '';
  if(!file) return;
  try{
    if(/\.zip$/i.test(file.name)){
      if(!(window.JSZip)) { toast('ZIPライブラリを読み込めませんでした。通信環境を確認してください'); return; }
      const zip = await JSZip.loadAsync(file);
      let dataJson = null; const imgs = [];
      const names = Object.keys(zip.files);
      for(const path of names){
        const entry = zip.files[path]; if(entry.dir) continue;
        if(/data\.json$/i.test(path) || (dataJson===null && /\.json$/i.test(path) && !/images\//i.test(path))){
          const txt = await entry.async('text');
          try{ dataJson = JSON.parse(txt); }catch(e){}
        } else if(/\.(webp|jpe?g|png|gif)$/i.test(path)){
          const b64 = await entry.async('base64');
          const ext = (path.match(/\.([a-zA-Z0-9]+)$/)||[])[1] || 'jpg';
          const mime = ext.toLowerCase()==='png' ? 'image/png' : (ext.toLowerCase()==='webp' ? 'image/webp' : 'image/jpeg');
          imgs.push({ base: fileBase(path), name: path.replace(/^.*[\\/]/,''), dataUrl: 'data:'+mime+';base64,'+b64 });
        }
      }
      if(dataJson) DB = mergeDataInto(DB, dataJson);
      let linked = 0;
      imgs.forEach(im=>{
        pendingImages[im.base] = { name: im.name, type: (im.dataUrl.match(/^data:([^;]+)/)||[])[1]||'image/jpeg', dataUrl: im.dataUrl };
        /* link to works awaiting this file name */
        DB.artists.forEach(a=>{ (a.works||[]).forEach(w=>{ if(w.file===im.base && !(w.img&&w.img.fileId)) linked++; }); });
      });
      savePendingImages(); saveDB();
      toast('取り込みました（画像 '+imgs.length+' 点、既存作品との対応 '+linked+' 件）。Drive接続時に画像をアップロードします', 4200);
    } else {
      const txt = await file.text();
      DB = mergeDataInto(DB, JSON.parse(txt));
      saveDB();
      toast('JSONを取り込みました');
    }
    renderList(); scheduleSync();
  }catch(e){
    toast('取り込みに失敗しました：'+(e && e.message ? e.message : e), 4000);
  }
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(DB, null, 1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = CONFIG.dataFile;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
async function wipeAll(){
  const ok = await confirmDialog({
    title: '全データを削除',
    body: '表示中の図鑑のデータをすべて削除します。Drive に接続している場合、次回の同期で Drive 側も空になります。削除した直後なら、画面下の「元に戻す」で復旧できます。',
    okLabel: '全データを削除する'
  });
  if(!ok) return;
  const snapDB = JSON.parse(JSON.stringify(DB));
  const snapPending = JSON.parse(JSON.stringify(pendingImages));
  DB = emptyData(); saveDB();
  Object.keys(pendingImages).forEach(k=>delete pendingImages[k]); savePendingImages();
  renderList(); showView('list');
  if(isDriveConnected()) syncNow('wipe');
  toastUndo('全データを削除しました', ()=>{
    DB = snapDB;
    Object.keys(pendingImages).forEach(k=>delete pendingImages[k]);
    Object.keys(snapPending).forEach(k=>{ pendingImages[k] = snapPending[k]; });
    savePendingImages(); saveDB(); renderList(); scheduleSync();
    toast('元に戻しました');
  });
}

/* ================= Google Drive sync（アプリ全体で1つ） ================= */
/* OAuth クライアントID（公開識別子・日記アプリと共通）。端末に保存値があればそれを優先し、無ければこの既定値を使う。ホーム画面への再追加で localStorage が消えても、接続前に ID の再入力を求めないための内蔵（本人の作業は Google ログインだけ）。 */
const DEFAULT_CLIENT_ID = '386087008053-de53ufnkvcnbjslkuhmq2l2pm9fj4c2t.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_API = 'https://www.googleapis.com/drive/v3';
const UPLOAD_API = 'https://www.googleapis.com/upload/drive/v3';
/* syncStatus/syncMsg/lastSyncAt は「表示中のデータセット」の鏡。実体は CTX[kind] に置く */
let syncStatus = 'disconnected', syncMsg = '', lastSyncAt = 0;
let appSyncRunning = false;
let syncQueue = Promise.resolve();

function getClientId(){ return (storeGet(CFG_ARTISTS.prefix+'clientId') || storeGet(CFG_DESIGNERS.prefix+'clientId') || DEFAULT_CLIENT_ID).trim(); }
function tokenFrom(prefix){
  const tok = sessGet(prefix+'token'); const exp = +(storeGet(prefix+'tokenExp')||0);
  if(tok && exp && Date.now() < exp-15000) return tok;
  return null;
}
function getValidToken(){ return tokenFrom(CFG_ARTISTS.prefix) || tokenFrom(CFG_DESIGNERS.prefix); }
function isDriveConnected(){ return !!getValidToken(); }
function storeToken(tok, expiresInSec){
  [CFG_ARTISTS.prefix, CFG_DESIGNERS.prefix].forEach(p=>{
    sessSet(p+'token', tok);
    storeSet(p+'tokenExp', String(Date.now() + (expiresInSec||3600)*1000));
    storeDel(p+'authError');
  });
}
function clearToken(){
  [CFG_ARTISTS.prefix, CFG_DESIGNERS.prefix].forEach(p=>{ sessDel(p+'token'); storeDel(p+'tokenExp'); });
}
function statusLabelFor(st, msg, at){
  let label, cls = '';
  if(st==='synced') label = '同期済み'+(at ? '（'+String(new Date(at).getHours()).padStart(2,'0')+':'+String(new Date(at).getMinutes()).padStart(2,'0')+'）' : '');
  else if(st==='syncing') label = '同期中…';
  else if(st==='error'){ label = '同期エラー'+(msg ? '：'+msg : ''); cls = 'err'; }
  else label = 'Drive未接続（端末内に保存中）';
  return { label:label, cls:cls };
}
function ctxStatus(kind){
  const c = CTX[kind]; return statusLabelFor(c.syncStatus, c.syncMsg, c.lastSyncAt);
}
function setCtxStatus(kind, st, msg){
  const c = CTX[kind]; if(!c) return;
  c.syncStatus = st; if(typeof msg==='string') c.syncMsg = msg;
  if(kind===DS){ syncStatus = c.syncStatus; syncMsg = c.syncMsg; lastSyncAt = c.lastSyncAt; }
  renderSyncStatus();
}
function setSyncStatus(st, msg){ setCtxStatus(DS, st, msg); }
function hhmm(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function appStatusInfo(){
  const a = CTX.artists, d = CTX.designers;
  if(appSyncRunning || a.syncStatus==='syncing' || d.syncStatus==='syncing') return { label:'同期中…', cls:'' };
  const errs = [a, d].filter(c=>c.syncStatus==='error');
  if(errs.length) return { label:'同期エラー：'+(errs[0].syncMsg||''), cls:'err' };
  const at = Math.max(a.lastSyncAt||0, d.lastSyncAt||0);
  if(at) return { label:'同期済み（'+hhmm(new Date(at))+'）', cls:'' };
  if(getValidToken()) return { label:'接続済み（未同期）', cls:'' };
  return { label:'Drive未接続（端末内に保存中）', cls:'' };
}
function renderSyncStatus(){
  const cur = ctxStatus(DS);
  const bar = $('syncbar'); if(bar) bar.innerHTML = '<span class="'+cur.cls+'">'+esc(cur.label)+'</span>';
  const ss = $('syncstat'); if(ss){ const s = appStatusInfo(); ss.innerHTML = '<span class="'+s.cls+'">'+esc(s.label)+'</span><span class="syncsum">作家 '+liveDB('artists').artists.length+'名／デザイナー '+liveDB('designers').artists.length+'名</span>'; }
  const bs = $('btnSync'); if(bs) bs.disabled = appSyncRunning;
  const bc = $('btnConnect'); if(bc) bc.disabled = appSyncRunning;
}
function appendSyncLine(label, msg, isErr){
  const box = $('syncresults'); if(!box) return;
  const d = document.createElement('div');
  d.className = 'syncline'+(isErr?' err':'');
  d.textContent = label+'：'+msg;
  box.appendChild(d);
}
function clearSyncLines(){ const box = $('syncresults'); if(box) box.innerHTML = ''; }

/* 編集後の自動同期：編集したデータセットだけを、トークンのみで静かに同期する（ポップアップなし） */
let autoSyncTimer = null, autoSyncKind = null;
function scheduleSync(){
  if(!getValidToken()) return;
  autoSyncKind = DS;
  if(autoSyncTimer) clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(()=>{ const k = autoSyncKind; autoSyncKind = null; if(k) queueSync(()=>syncDatasetFlow(k, 'auto')); }, 1500);
}
function connectDrive(){
  const cid = getClientId();
  if(!(window.google && google.accounts && google.accounts.oauth2)){
    toast('Googleのライブラリを読み込めませんでした。通信環境を確認してください', 4000); return;
  }
  try{
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: cid, scope: DRIVE_SCOPE, ux_mode: 'popup',
      callback: function(resp){
        if(resp && resp.access_token){
          storeToken(resp.access_token, parseInt(resp.expires_in||'3600',10));
          [CFG_ARTISTS.prefix, CFG_DESIGNERS.prefix].forEach(p=>storeDel(p+'pendingAuth'));
          clearSyncLines();
          queueSync(()=>runAppSync('connect', true));
        } else { setCtxStatus('artists', 'error', 'トークンを取得できませんでした'); setCtxStatus('designers', 'error', 'トークンを取得できませんでした'); }
      },
      error_callback: function(err){
        const t = '認証エラー：'+((err && (err.type||err.message)) || 'unknown');
        [CFG_ARTISTS.prefix, CFG_DESIGNERS.prefix].forEach(p=>storeSet(p+'authError', t));
        setCtxStatus('artists', 'error', t); setCtxStatus('designers', 'error', t);
      }
    });
    [CFG_ARTISTS.prefix, CFG_DESIGNERS.prefix].forEach(p=>storeSet(p+'pendingAuth', String(Date.now())));
    tc.requestAccessToken();
  }catch(e){ toast('接続を開始できませんでした：'+(e && e.message ? e.message : e), 4000); }
}
function disconnectDrive(){
  const tok = getValidToken();
  if(tok && window.google && google.accounts && google.accounts.oauth2){
    try{ google.accounts.oauth2.revoke(tok, function(){}); }catch(e){}
  }
  clearToken();
  setCtxStatus('artists', 'disconnected'); setCtxStatus('designers', 'disconnected');
  toast('Drive との接続を解除しました');
}
async function driveFetch(path, opts){
  const tok = getValidToken(); if(!tok) throw new Error('no token');
  return fetch(DRIVE_API+path, Object.assign({}, opts||{}, { headers: Object.assign({ Authorization:'Bearer '+tok }, (opts&&opts.headers)||{}) }));
}
async function loadDriveImage(fid){
  if(driveImgCache[fid]) return driveImgCache[fid];
  const tok = getValidToken(); if(!tok) return null;
  const res = await fetch(DRIVE_API+'/files/'+encodeURIComponent(fid)+'?alt=media', { headers:{ Authorization:'Bearer '+tok } });
  if(!res.ok) return null;
  const blob = await res.blob();
  const url = URL.createObjectURL(blob); driveImgCache[fid] = url;
  return url;
}
function dataURLtoBlob(dataUrl){
  const m = /^data:([^;,]+)?(;base64)?,(.*)$/.exec(dataUrl||'');
  if(!m) return new Blob([]);
  if(m[2]){ const bin = atob(m[3]); const arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr], { type:m[1]||'image/jpeg' }); }
  return new Blob([decodeURIComponent(m[3])], { type:m[1]||'image/jpeg' });
}

/* ---------- 同期ランナー ----------
   各データセットの文脈（CTX[kind] とその保存キー）を掴んで走るため、実行中に
   ユーザーが表示データセットを切り替えても、書き込み先を取り違えない。
   すべての同期は queueSync で直列化する。切替は一切ブロックしない。 */
function fetchT(url, opts, ms){
  return new Promise((resolve, reject)=>{
    let ctl = null;
    try{ ctl = new AbortController(); }catch(e){}
    const to = setTimeout(()=>{ try{ if(ctl) ctl.abort(); }catch(e){} reject(new Error('通信がタイムアウトしました')); }, ms||30000);
    const o = Object.assign({}, opts||{}); if(ctl) o.signal = ctl.signal;
    fetch(url, o).then(r=>{ clearTimeout(to); resolve(r); }, e=>{ clearTimeout(to); reject(e); });
  });
}
async function driveReq(tok, path, opts, ms){
  return fetchT(DRIVE_API+path, Object.assign({}, opts||{}, { headers: Object.assign({ Authorization:'Bearer '+tok }, (opts&&opts.headers)||{}) }), ms||30000);
}
async function findDataFileFor(tok, dataFile){
  const q = encodeURIComponent("name='"+dataFile+"' and trashed=false");
  const res = await driveReq(tok, '/files?q='+q+'&fields='+encodeURIComponent('files(id,name,createdTime)')+'&orderBy=createdTime');
  if(!res.ok) throw new Error('files.list HTTP '+res.status);
  const j = await res.json();
  const files = (j.files||[]).filter(f=>f.name===dataFile);
  return files.length ? files[0] : null;
}
async function createDataFileFor(tok, dataFile, data){
  const meta = { name: dataFile, mimeType:'application/json' };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(meta)], { type:'application/json' }));
  form.append('file', new Blob([JSON.stringify(data)], { type:'application/json' }), dataFile);
  const res = await fetchT(UPLOAD_API+'/files?uploadType=multipart&fields=id', { method:'POST', headers:{ Authorization:'Bearer '+tok }, body: form }, 60000);
  if(!res.ok) throw new Error('create HTTP '+res.status);
  return res.json();
}
async function uploadDataUpdateFor(tok, fileId, data){
  const res = await fetchT(UPLOAD_API+'/files/'+encodeURIComponent(fileId)+'?uploadType=media', {
    method:'PATCH', headers:{ Authorization:'Bearer '+tok, 'Content-Type':'application/json' }, body: JSON.stringify(data)
  }, 60000);
  if(!res.ok) throw new Error('update HTTP '+res.status);
}
/* そのデータセットの保留画像をアップロードし、fileId を data 内の作品へ書き込む */
async function uploadPendingImagesFor(prefix, data, tok){
  let pend = {};
  try{ pend = JSON.parse(storeGet(prefix+'pendingImages')||'{}'); }catch(e){}
  if(!pend || typeof pend!=='object') pend = {};
  const bases = Object.keys(pend);
  if(!bases.length) return data;
  for(const base of bases){
    const p = pend[base]; if(!p) continue;
    try{
      const meta = { name: p.name || (base+'.jpg'), mimeType: p.type || 'image/jpeg' };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(meta)], { type:'application/json' }));
      form.append('file', dataURLtoBlob(p.dataUrl), meta.name);
      const res = await fetchT(UPLOAD_API+'/files?uploadType=multipart&fields=id', { method:'POST', headers:{ Authorization:'Bearer '+tok }, body: form }, 60000);
      if(!res.ok) throw new Error('photo upload HTTP '+res.status);
      const j = await res.json();
      if(j && j.id){
        data.artists.forEach(a=>{ (a.works||[]).forEach(w=>{ if(w.file===base) w.img = { fileId: j.id }; }); });
        delete pend[base];
      }
    }catch(e){ /* 保留のまま次回再試行 */ }
  }
  try{ storeSet(prefix+'pendingImages', JSON.stringify(pend)); }catch(e){}
  return data;
}
function refreshAfterSync(kind){
  if(kind!==DS || isEditing()) return;
  if(view==='list') renderList();
  else if(view==='detail' && state.detailId!=null) renderDetail();
  else if(view==='ex') renderEx();
  else if(view==='timeline') renderTimeline();
  renderAbout();
}
/* 1データセット分の同期。ストレージを正として読み書きし、結果を CTX[kind] に残す。
   成功・失敗どちらでも必ず状態が確定する（同期中のまま残らない）。 */
async function syncDatasetFlow(kind, reason){
  const c = CTX[kind]; if(!c) return { ok:false, msg:'対象がありません' };
  const cfg = c.cfg, prefix = cfg.prefix;
  const tok = getValidToken();
  if(!tok){ setCtxStatus(kind, 'disconnected'); return { ok:false, msg:'Drive未接続' }; }
  setCtxStatus(kind, 'syncing');
  try{
    let data = null;
    const raw = storeGet(prefix+'data');
    if(raw){ try{ data = normalizeFor(kind, JSON.parse(raw)); }catch(e){ data = null; } }
    if(!data) data = c.DB;
    data = await uploadPendingImagesFor(prefix, data, tok);
    const file = await findDataFileFor(tok, cfg.dataFile);
    if(!file){
      const created = await createDataFileFor(tok, cfg.dataFile, data);
      if(created && created.id) storeSet(prefix+'driveFileId', created.id);
    } else {
      storeSet(prefix+'driveFileId', file.id);
      if(reason!=='wipe'){
        const res = await driveReq(tok, '/files/'+encodeURIComponent(file.id)+'?alt=media', null, 60000);
        if(!res.ok) throw new Error('download HTTP '+res.status);
        const remote = normalizeFor(kind, JSON.parse(await res.text()));
        data = mergeDataInto(data, remote);
      }
      await uploadDataUpdateFor(tok, file.id, data);
    }
    storeSet(prefix+'data', JSON.stringify(data));
    c.DB = data;
    if(kind===DS) DB = data;
    c.lastSyncAt = Date.now();
    setCtxStatus(kind, 'synced');
    refreshAfterSync(kind);
    return { ok:true, msg:'同期しました（'+hhmm(new Date())+'）' };
  }catch(e){
    const m = (e && e.message) ? e.message : String(e);
    setCtxStatus(kind, 'error', m);
    return { ok:false, msg:'同期に失敗しました（'+m+'）' };
  }
}
function queueSync(task){
  const run = ()=>task();
  const p = syncQueue.then(run, run);
  syncQueue = p.then(()=>{}, ()=>{});
  return p;
}
async function runAppSync(reason, showResults){
  appSyncRunning = true; renderSyncStatus();
  try{
    for(const kind of ['artists','designers']){
      const r = await syncDatasetFlow(kind, reason);
      if(showResults) appendSyncLine(CTX[kind].cfg.appName, r.msg, !r.ok);
    }
  }finally{
    appSyncRunning = false; renderSyncStatus();
  }
}
function appSyncBtn(){
  if(appSyncRunning) return;
  if(!getValidToken()){ toast('Drive未接続です。先に「Drive に接続」を押してください', 3200); return; }
  clearSyncLines();
  queueSync(()=>runAppSync('manual', true));
}
/* 旧来の呼び出し（全削除時の即時同期など）の受け口：表示中データセットのみ同期する */
function syncNow(reason){
  if(reason==='manual'){ appSyncBtn(); return; }
  if(reason==='connect'){ queueSync(()=>runAppSync('connect', true)); return; }
  const kind = DS;
  queueSync(()=>syncDatasetFlow(kind, reason));
}

/* ---------- pill nav swipe ---------- */
(function(){
  const nav = $('pillnav'); if(!nav) return;
  const order = ['artists','designers','settings'];
  function currentDest(){ return view==='settings'? 'settings': DS; }
  function goDest(dest){
    if(dest==='settings'){ showView('settings'); return; }
    switchDataset(dest);
  }
  let sx = null, sy = null, suppressClick = false;
  nav.addEventListener('touchstart', e=>{ const t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive:true });
  nav.addEventListener('touchend', e=>{
    if(sx==null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null; sy = null;
    if(Math.abs(dx) < 40 || Math.abs(dx) <= Math.abs(dy)) return; /* 横方向が dominant な時だけ */
    suppressClick = true;
    const cur = order.indexOf(currentDest());
    const next = order[(cur + (dx<0? 1: order.length-1)) % order.length];
    goDest(next);
  }, { passive:true });
  nav.addEventListener('click', e=>{ if(suppressClick){ suppressClick = false; e.preventDefault(); e.stopPropagation(); } }, true);
})();

/* ---------- segment drag-switch (v2.18) ----------
   iOS segmented controls switch by dragging across them; ours only had
   click handlers, so a drag did nothing at all — and where swipe-back is
   armed (detail / ex / timeline / quiz) the page swipe stole the gesture
   and navigated away instead. One delegated handler covers every segment
   group, including the ones re-rendered into innerHTML (.dtabs, the ex
   sort seg, the timeline / quiz region switches):
   - during the drag nothing is activated yet — the .on highlight follows
     the finger as a preview. Activating mid-drag would re-render the
     group, and replacing the touch's target node kills the rest of the
     touch stream (verified in Chromium: every move after the first went
     silent), so the switch would only ever land halfway;
   - on release, the button under the finger is activated once;
   - the compatibility click after a claimed drag is suppressed, and the
     swipe-back handler never arms from a segment (see its touchstart). */
const SEG_SEL = '.seg, .modebar, .dtabs';
let segDrag = null, segSuppressUntil = 0;
function segBtnUnder(x, y){
const el = document.elementFromPoint(x, y);
if(!el || !el.closest) return null;
const b = el.closest('button');
if(!b) return null;
return b.closest(SEG_SEL)? b: null;
}
function segPreview(box, btn){
if(!box) return;
box.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===btn));
}
document.addEventListener('touchstart', e=>{
if(!e.touches || e.touches.length!==1) return;
if(!e.target || !e.target.closest) return;
const box = e.target.closest(SEG_SEL);
if(!box) return;
const t = e.touches[0];
segDrag = { box:box, sx:t.clientX, sy:t.clientY, claimed:false, previewBtn:segBtnUnder(t.clientX, t.clientY), activeBtn:box.querySelector('button.on') };
}, { passive:true });
document.addEventListener('touchmove', e=>{
const d = segDrag; if(!d) return;
const t = e.touches && e.touches[0]; if(!t) return;
const dx = t.clientX - d.sx, dy = t.clientY - d.sy;
if(!d.claimed){
if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)*1.15){ d.claimed = true; }
else if(Math.abs(dy) > 12 && Math.abs(dy) >= Math.abs(dx)){ segDrag = null; return; }
else return;
}
e.preventDefault();
const b = segBtnUnder(t.clientX, t.clientY);
if(!b) return;
const box = b.closest(SEG_SEL);
if(box) d.box = box;
if(b !== d.previewBtn){ d.previewBtn = b; segPreview(box, b); }
}, { passive:false });
function segDragEnd(commit){
const d = segDrag; segDrag = null;
if(!d || !d.claimed) return;
segSuppressUntil = Date.now() + 350;
if(commit && d.previewBtn){ const b = d.previewBtn; d.previewBtn = null; b.click(); }
/* cancelled drags put the .on highlight back where the state actually is */
else if(!commit && d.box && d.box.isConnected){ segPreview(d.box, d.activeBtn); }
}
document.addEventListener('touchend', ()=>segDragEnd(true), { passive:true });
document.addEventListener('touchcancel', ()=>segDragEnd(false), { passive:true });
document.addEventListener('click', e=>{
if(Date.now() < segSuppressUntil){ segSuppressUntil = 0; e.preventDefault(); e.stopPropagation(); }
}, true);

/* ---------- swipe back: the finger drives the transition itself ---------- */
function backTarget(){
  if(view==='quiz') return 'timeline';
  if(view==='detail' || view==='timeline' || view==='ex' || view==='settings') return 'list';
  return null;
}
function goBack(){ const t = backTarget(); if(t) showView(t); }
function engageSwipe(st){
  if(st.target==='list') renderList();
  if(st.target==='timeline') renderTimeline();
  const oldEl = $(VIEW_EL[view]), newEl = $(VIEW_EL[st.target]);
  if(!oldEl || !newEl){ st.engaged = false; return; }
  st.oldEl = oldEl; st.newEl = newEl;
  const hdr = document.querySelector('header.top');
  st.H = hdr? hdr.offsetHeight: 0;
  st.y = window.scrollY || 0;
  newEl.classList.remove('hidden');
  oldEl.classList.add('vt-fixed');
  oldEl.style.top = (st.H - st.y)+'px';
  oldEl.style.height = '100dvh';
  document.body.classList.add('vt-run');
  window.scrollTo(0,0);
  st.engaged = true;
  paintSwipe(st);
}
function paintSwipe(st){
  const W = window.innerWidth || 1;
  const pr = Math.min(1, st.dx / W);
  st.oldEl.style.transform = 'translateX('+st.dx+'px)';
  /* reduced motion: no parallax on the incoming view */
  st.newEl.style.transform = reducedMotion()? 'translateX(0%)' : 'translateX('+(-26*(1-pr)).toFixed(2)+'%)';
}
function finishSwipe(st, commit){
  if(reducedMotion()){ teardownSwipe(st, commit); return; }
  const W = window.innerWidth || 1;
  const pr = Math.min(1, st.dx / W);
  const dur = commit? 240: 200;
  const aOut = st.oldEl.animate(
    [{ transform:'translateX('+st.dx+'px)' },{ transform:'translateX('+(commit? W+8: 0)+'px)' }],
    { duration:dur, easing:VT_EASE, fill:'both' });
  const aIn = st.newEl.animate(
    [{ transform:'translateX('+(-26*(1-pr)).toFixed(2)+'%)' },{ transform:'translateX('+(commit? 0: -26)+'%)' }],
    { duration:dur, easing:VT_EASE, fill:'both' });
  st.anims = [aOut, aIn];
  Promise.all(st.anims.map(a=>a.finished.catch(()=>{}))).then(()=>teardownSwipe(st, commit));
  setTimeout(()=>teardownSwipe(st, commit), dur+100);
}
function teardownSwipe(st, commit){
  if(st.done) return; st.done = true;
  if(st.anims) st.anims.forEach(a=>{ try{ a.cancel(); }catch(e){} });
  [st.oldEl, st.newEl].forEach(el=>{ if(!el) return; el.classList.remove('vt-fixed'); el.style.top=''; el.style.height=''; el.style.transform=''; });
  document.body.classList.remove('vt-run');
  if(swipeSt===st) swipeSt = null;
  if(commit){
    st.oldEl.classList.add('hidden');
    view = st.target;
    if(view!=='settings') CTX[DS].lastView = view;
    $('fabAdd').classList.toggle('hidden', view!=='list');
    $('navEx').classList.toggle('on', view==='ex');
    $('navTimeline').classList.toggle('hidden', DS!=='artists');
    $('navTimeline').classList.toggle('on', view==='timeline');
    updatePill(); moveNavInd(true);
    window.scrollTo(0,0);
  } else if(st.newEl){
    st.newEl.classList.add('hidden');
    window.scrollTo(0, st.y||0);
  }
  pinNav();
}
(function(){
  document.addEventListener('touchstart', e=>{
    if(swipeSt) return;
    if(vtBusy) return; /* 遷移アニメーション中は触らない */
    if(!e.touches || e.touches.length!==1) return;
    if(e.target && e.target.closest && e.target.closest('#pillnav')) return;
    if(e.target && e.target.closest && e.target.closest(SEG_SEL)) return; /* segment drags belong to the segment (v2.18) */
    const vw = $('viewer'); if(vw && vw.classList.contains('open')) return;
    if(isEditing()) return; /* 編集フォーム表示中は無効 */
    const target = backTarget(); if(!target) return; /* 一覧では何もしない */
    const t = e.touches[0];
    swipeSt = { sx:t.clientX, sy:t.clientY, dx:0, target:target, engaged:false, done:false,
                px:t.clientX, pt:Date.now(), vx:0 };
  }, { passive:true });
  document.addEventListener('touchmove', e=>{
    const st = swipeSt; if(!st || st.done) return;
    const t = e.touches && e.touches[0]; if(!t) return;
    const dx = t.clientX - st.sx, dy = t.clientY - st.sy;
    const now = Date.now();
    if(now > st.pt){ const v = (t.clientX - st.px) / Math.max(1, now - st.pt); st.vx = 0.7*st.vx + 0.3*v; }
    st.px = t.clientX; st.pt = now;
    if(!st.engaged){
      if(dx > 12 && Math.abs(dx) > Math.abs(dy)*1.25){ st.dx = Math.max(0, dx); engageSwipe(st); }
      else if(Math.abs(dy) > 14 && Math.abs(dy) >= Math.abs(dx)){ swipeSt = null; }
      return;
    }
    e.preventDefault(); /* 横スワイプ確定後は縦スクロールを止める */
    st.dx = Math.max(0, dx);
    paintSwipe(st);
  }, { passive:false });
  document.addEventListener('touchend', e=>{
    const st = swipeSt; if(!st) return;
    swipeSt = null;
    if(!st.engaged || st.done) return;
    const W = window.innerWidth || 1;
    const commit = st.dx > W*0.35 || (st.dx > 56 && st.vx > 0.3);
    finishSwipe(st, commit);
  }, { passive:true });
  document.addEventListener('touchcancel', ()=>{
    const st = swipeSt; swipeSt = null;
    if(st && st.engaged && !st.done) finishSwipe(st, false);
  }, { passive:true });
})();

/* ================= self update ================= */
const APP_VERSION = '2.21';
function isEditing(){ return !!document.getElementById('ef_name'); }
function checkForUpdate(){
  if(location.hash && location.hash.indexOf('access_token')>=0) return; /* 認証戻りの時は触らない */
  try{
    fetch(location.pathname+'?cv='+Date.now(), { cache:'no-store' })
      .then(r=>r.text())
      .then(t=>{
        const m = t.match(/name="app-version" content="([0-9.]+)"/);
        if(!m) return;
        const latest = m[1];
        if(latest===APP_VERSION){ try{ sessionStorage.removeItem(CONFIG.prefix+'updateTried'); }catch(e){} return; }
        let tried = null;
        try{ tried = sessionStorage.getItem(CONFIG.prefix+'updateTried'); }catch(e){}
        if(tried===latest) return; /* ループ防止：同じ版への再読み込みは1回だけ */
        try{ sessionStorage.setItem(CONFIG.prefix+'updateTried', latest); }catch(e){}
        location.replace(location.pathname+'?u='+Date.now()+location.hash); /* hash（#designers等）を保持する */
      })
      .catch(()=>{});
  }catch(e){}
}
let updHiddenAt = 0;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ updHiddenAt = Date.now(); return; }
  /* 長く裏にいた後の復帰でも確認する（編集中は邪魔しない） */
  if(updHiddenAt && Date.now()-updHiddenAt>=60000 && !isEditing()) checkForUpdate();
});

/* ================= bundled data pack =================
   アプリ同梱の datapack.json（移行済み最終データ）を、初回起動時に一度だけ
   既存の端末データへマージする。適用済み版数は 'zukanDataPack.applied' に記録。
   失敗しても適用済みにせず（次回起動で再試行）、起動自体は必ず続行する。 */
const DATA_PACK = 7;
const LS_PACK_APPLIED = 'zukanDataPack.applied';
/* パック側より新しいローカル編集がある作家は、パックで上書きしない */
function packGuardNewerLocal(local, packData){
  if(!local || !Array.isArray(local.artists) || !packData || !Array.isArray(packData.artists)) return packData;
  const ts = s=>{ const t = Date.parse(s||''); return isNaN(t)? 0: t; };
  const drop = new Set();
  local.artists.forEach(la=>{
    if(!la || !la.name || !la.updated_at) return;
    const ia = packData.artists.find(p=>p && ((p.id!=null && la.id!=null && String(p.id)===String(la.id) && p.name===la.name) || p.name===la.name));
    if(ia && ts(la.updated_at) > ts(ia.updated_at)) drop.add(ia);
  });
  if(!drop.size) return packData;
  const copy = Object.assign({}, packData);
  copy.artists = packData.artists.filter(a=>!drop.has(a));
  return copy;
}
async function applyDataPack(){
  let applied = 0;
  try{ applied = parseInt(storeGet(LS_PACK_APPLIED)||'0', 10) || 0; }catch(e){}
  if(applied >= DATA_PACK) return false;
  let pack = null;
  try{
    let ctl = null, timer = null;
    if(typeof AbortController!=='undefined'){ ctl = new AbortController(); timer = setTimeout(()=>{ try{ ctl.abort(); }catch(e){} }, 20000); }
    const res = await fetch('datapack.json', ctl? { cache:'no-store', signal:ctl.signal }: { cache:'no-store' });
    if(timer) clearTimeout(timer);
    if(!res || !res.ok) return false;
    pack = await res.json();
  }catch(e){ return false; }
  if(!pack || typeof pack!=='object') return false;
  try{
    for(const kind of ['artists','designers']){
      const incoming = pack[kind];
      if(!incoming || typeof incoming!=='object' || !Array.isArray(incoming.artists)) continue;
      const c = CTX[kind]; if(!c) continue;
      const prefix = c.cfg.prefix;
      let data = null;
      const raw = storeGet(prefix+'data');
      if(raw){ try{ data = normalizeFor(kind, JSON.parse(raw)); }catch(e){ data = null; } }
      if(!data) data = c.DB;
      data = mergeDataInto(data, packGuardNewerLocal(data, incoming));
      const incN = normalizeData(incoming);
      /* ルートの sections はパック側を正とする。mergeDataInto は sections を
         和集合でしか増やさないため、再分類（pack 4）の配信では旧区分が残って
         しまう。パックは正本のスナップショットなので配列ごと置き換える
         （各人の section 自体はマージで置換済み。表示順もこの配列に追随する） */
      if(Array.isArray(incN.sections) && incN.sections.length) data.sections = incN.sections.slice();
      /* 年表・クイズがローカルに無い場合はパックから補う（鮮度判定で漏れた場合の保険） */
      if(data.timeline==null && incN.timeline) data.timeline = incN.timeline;
      if(!quizHasData(data.quiz) && quizHasData(incN.quiz)) data.quiz = incN.quiz;
      data.kind = kind;
      storeSet(prefix+'data', JSON.stringify(data));
      c.DB = data;
      if(kind===DS) DB = data;
    }
  }catch(e){ return false; }
  storeSet(LS_PACK_APPLIED, String(DATA_PACK));
  return true;
}

/* ================= opening veil (v2.11) =================
   実体は静的HTML＋CSS（真っ黒なベールがフェードしてUIを現すだけ）。
   ここはスキップとノード除去だけを行う。被せるだけで起動フロー
   （データパック適用・自動同期・初期描画）は止めない。 */
(function(){
  var v = document.getElementById('veil');
  if(!v) return;
  var done = false;
  function kill(){ if(done) return; done = true; try{ v.remove(); }catch(e){} }
  v.addEventListener('click', kill);
  v.addEventListener('touchend', function(e){ e.preventDefault(); kill(); }, { passive:false });
  var reduced = false;
  try{ reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(reduced){ kill(); return; }
  setTimeout(kill, 750); /* フェード（.1s +.45s）完了直後に除去 */
})();

(async function init(){
  const startDS = (location.hash==='#designers')? 'designers': 'artists';
  ['artists','designers'].forEach(k=>{ DS = k; bindCtx(); loadPendingImages(); loadCtxData(k); });
  DS = startDS; bindCtx();
  /* 表示モードのアプリ共通化：共通キーが無ければ開始データセットの既存値を初期値として移行し、両データセットへ統一する */
  const uniMode = storeGet(LS_APP_MODE) || storeGet(CTX[startDS].cfg.prefix+'mode') || storeGet(CTX[startDS==='artists'?'designers':'artists'].cfg.prefix+'mode') || 'def';
  Object.keys(CTX).forEach(k=>{ CTX[k].state.mode = uniMode; });
  state.mode = uniMode;
  storeSet(LS_APP_MODE, uniMode);
  await applyDataPack();
  if(!CTX.designers.loadedFromStore && !storeGet(CFG_DESIGNERS.prefix+'data')) loadDesignersSeed();
  updateHeader(); updatePill();
  renderList(); renderSyncStatus(); renderAbout();
  requestAnimationFrame(()=>moveNavInd(false));
  window.addEventListener('load', ()=>moveNavInd(false));
  checkForUpdate();
  /* 起動時自動同期：有効な（期限内の）トークンがある時だけ、ポップアップなしで
     静かにアプリ全体を同期する。トークンが無ければ何もしない。 */
  if(getValidToken()){
    queueSync(()=>runAppSync('startup', false));
  } else {
    const ae = storeGet(CFG_ARTISTS.prefix+'authError') || storeGet(CFG_DESIGNERS.prefix+'authError');
    if(ae) setCtxStatus(DS, 'error', ae);
  }
  pinNav();
})();
