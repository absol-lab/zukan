<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="図鑑">
<meta name="theme-color" content="#f4eedd">
<meta name="app-version" content="2.21">
<link rel="apple-touch-icon" href="IMG_2278.png">
<link rel="apple-touch-startup-image" href="IMG_2389.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="icon" type="image/png" href="icon.png">
<title>図鑑</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" async defer></script>
<style>
:root{
  /* diary (kinari) design tokens */
  --bg:#f1ebda; --bg2:#eae2cd; --card:#faf6ea; --card2:#f3eddb;
  /* v2.11: --muted / --danger darkened within the sumi x kinari world so that
     secondary text clears WCAG 4.5:1 on every ground (muted min 5.02:1 on
     --bg2, danger min 4.51:1 on --bg2). --lineStrong gives input boundaries
     the required 3:1 against adjacent grounds; --line stays a hairline. */
  --text:#211d14; --muted:#675d49; --accent:#57503e; --line:#ddd2b8; --lineStrong:#8a7a54;
  --danger:#b93527; --nav:rgba(250,246,234,.95); --sheet:rgba(60,52,32,.35);
  --fab:#57503e; --fabink:#f1ebda;
  /* legacy aliases (older class names / inline styles) */
  --paper:var(--bg); --paper2:var(--bg2); --ink:var(--text);
  --ink60:var(--muted); --ink35:rgba(33,29,20,.65);
  --lineSoft:var(--line); --shu:var(--danger);
  --serif:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.65;
  padding-bottom:108px; -webkit-text-size-adjust:100%;}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0; -webkit-appearance:none; appearance:none;}
input,select,textarea{font:inherit; color:inherit;}
a{color:var(--accent);}
.homelink{font-size:12.5px; color:var(--muted); text-decoration:none; letter-spacing:.08em; white-space:nowrap; padding:6px 0;}
/* header (diary .topbar) */
header.top{position:sticky; top:0; z-index:30; background:var(--bg);}
.toprow{display:flex; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top, 0px) + 10px) 14px 4px; max-width:720px; margin:0 auto;}
h1.appname{font-family:var(--sans); font-size:18px; font-weight:700; letter-spacing:.08em; margin:0;}
.topcount{font-size:13px; color:var(--muted);}
.topsp{flex:1;}
button.txtbtn{background:none; border:none; font-size:13px; letter-spacing:.06em; color:var(--accent); font-weight:600; padding:6px 4px;}
#navEx, #navTimeline{border:1px solid var(--line); background:var(--bg2); border-radius:999px; padding:7px 14px; font-size:12.5px; color:var(--text); font-weight:400; letter-spacing:.06em;}
#navEx.on, #navTimeline.on{background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:600;}
#syncbar{text-align:center; font-size:13px; color:var(--muted); padding:0 16px 6px; min-height:1.2em; letter-spacing:.03em;}
#syncbar .err{color:var(--danger);}
/* toolbar */
main{display:block; max-width:720px; margin:0 auto; padding:0 14px; min-height:calc(100dvh + 1px);}
.toolbar{padding:6px 0 2px;}
.seg{display:inline-flex; gap:8px; flex-wrap:wrap;}
.seg button{background:var(--bg2); border:1px solid var(--line); color:var(--text); padding:8px 16px; font-size:13px; letter-spacing:.06em; border-radius:999px; font-family:var(--sans); min-height:48px; display:inline-flex; align-items:center; justify-content:center;}
.seg button.on{background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:600;}
.seg.mini button{padding:7px 12px; font-size:12.5px;}
.searchrow{display:flex; gap:8px; margin-top:10px;}
.searchrow input[type=search]{flex:1; background:var(--card); border:1px solid var(--lineStrong); border-radius:999px; padding:11px 16px; font-size:16px; min-height:48px; color:var(--text); outline:none; -webkit-appearance:none;}
.tagrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.tagchip{border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:7px 13px; font-size:12.5px; min-height:48px; display:inline-flex; align-items:center;}
.tagchip:active{background:var(--card2);}
.tagchip.on{background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:600;}
.tagmore{border:1px solid var(--line); background:none; color:var(--muted); border-radius:999px; padding:7px 13px; font-size:12.5px; letter-spacing:.04em; min-height:48px; display:inline-flex; align-items:center;}
#tagrow{display:block;}
.taggroup{margin-top:14px;}
.taggroup:first-child{margin-top:2px;}
.taggrouphead{font-size:12.5px; color:var(--muted); letter-spacing:.14em; margin-bottom:6px;}
.taggrouprow{display:flex; flex-wrap:wrap; gap:8px;}
#tagrow .tagflat{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
/* tag accordions (file-like collapsible group rows) */
.tagacc{margin-top:8px;}
.tagaccrow{display:flex; align-items:center; gap:8px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 14px; font-family:var(--sans); text-align:left; color:var(--text); min-height:48px;}
.tagaccrow .tagnm{font-size:13px; font-weight:600; letter-spacing:.1em;}
.tagaccrow .tagcnt{font-size:13px; color:var(--muted);}
.tagaccrow .tagchev{margin-left:auto; color:var(--muted); font-size:13px;}
.tagacc .taggrouprow{margin-top:8px;}
.modebar{display:flex; margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
.modebar button{flex:1; background:none; border:none; border-left:1px solid var(--line); padding:9px 0; font-size:12.5px; letter-spacing:.06em; color:var(--muted); font-family:var(--sans); min-height:48px;}
.modebar button:first-child{border-left:none;}
.modebar button.on{color:var(--text); font-weight:600; box-shadow:inset 0 -3px 0 var(--accent);}
.syncline{font-size:13px; color:var(--muted); margin-top:8px;}
.syncline.err{color:var(--danger);}
/* list (diary .card / .monthhead) */
h2.sechead{font-family:var(--sans); font-size:16.5px; font-weight:700; letter-spacing:.04em; margin:22px 2px 4px; display:flex; justify-content:space-between; align-items:baseline;}
h2.sechead .cnt{font-size:12px; color:var(--muted); font-weight:400; letter-spacing:.05em;}
.grid{display:grid; gap:12px; margin-top:10px;}
.grid.wide{grid-template-columns:1fr;}
.grid.def{grid-template-columns:1fr 1fr;}
.grid.compact{grid-template-columns:repeat(3,1fr); gap:10px;}
.grid.mini{grid-template-columns:repeat(4,1fr); gap:8px;}
figure.work{margin:0; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px; cursor:pointer; overflow:hidden;}
figure.work:active{background:var(--card2);}
figure.work .ph{aspect-ratio:4/3; background:var(--bg2); display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:9px;}
figure.work .ph img{width:100%; height:100%; object-fit:cover; display:block;}
figure.work .ph .noimg{font-family:var(--serif); font-size:11px; color:var(--ink35); letter-spacing:.2em; padding:6px; text-align:center;}
figure.work .ph.noplate{aspect-ratio:auto; height:58px; background:var(--bg);}
figure.work .ph.noplate .noimg{font-size:10.5px; letter-spacing:.08em; line-height:1.55; padding:4px 8px;}
.grid.wide figure.work .ph.noplate{height:72px;}
.grid.compact figure.work .ph.noplate{height:40px;}
.gallery figure.work .ph.noplate{aspect-ratio:auto; height:88px;}
/* v2.18: a plate whose image FAILED keeps the image box exactly. fail()
   used to add .noplate, whose shorter fixed heights shrank tiles in waves
   while scrolling (document height lurched by over 1,700px in testing) —
   the layout-shift storm behind the garbled/overlapping mini grid.
   Failure is now a visual state only, never a geometry change. */
figure.work .ph.platefail{background:var(--bg);}
/* v2.18: in mini, the no-image plate takes the same 4/3 box as image tiles
   (uniform rows instead of ragged short cards) and carries a typographic
   placeholder — the name's initial over 図版なし — so an image-less tile
   reads as a deliberate plate, not a broken blank. The initial is only
   shown in mini; other modes keep the plain 図版なし strip. */
.grid.mini figure.work .ph.noplate{aspect-ratio:4/3; height:auto;}
figure.work .ph.noplate .ini{display:none;}
.grid.mini figure.work .ph.noplate .noimg{display:flex; flex-direction:column; align-items:center; gap:1px; padding:2px;}
.grid.mini figure.work .ph.noplate .ini{display:block; font-size:17px; line-height:1.15; letter-spacing:0;}
figure.work figcaption{padding:7px 4px 3px;}
figure.work .nm{font-family:var(--serif); font-size:14.5px; line-height:1.35;}
figure.work .sub{font-size:10.5px; color:var(--muted); line-height:1.4; margin-top:1px;}
.grid.wide figure.work .nm{font-size:18px;}
.grid.compact figure.work .nm{font-size:12px;}
.grid.compact figure.work .sub{display:none;}
.grid.mini figure.work .nm{font-size:10.5px;}
.grid.mini figure.work .sub{display:none;}
.grid.mini figure.work{padding:3px;}
.grid.mini figure.work figcaption{padding:3px 1px 1px;}
.empty{padding:40px 0; text-align:center; color:var(--muted); font-size:13.5px; letter-spacing:.06em;}
/* detail */
.detailhead{padding:10px 0 0;}
button.backbtn{background:none; border:none; color:var(--muted); font-size:14.5px; padding:8px 18px 8px 0; letter-spacing:.04em; display:inline-flex; align-items:center; min-height:48px;}
.dname{font-family:var(--serif); font-size:26px; line-height:1.3; margin:6px 0 0; letter-spacing:.05em;}
.dlatin{font-size:14px; color:var(--muted); margin-top:2px;}
.dmeta{font-size:13.5px; color:var(--muted); margin-top:10px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 14px; display:flex; flex-wrap:wrap; gap:4px 14px;}
.dtabs{display:flex; gap:8px; margin-top:14px;}
.dtabs button{flex:1; background:var(--bg2); border:1px solid var(--line); color:var(--text); border-radius:999px; font-family:var(--sans); font-size:13.5px; letter-spacing:.14em; padding:9px 0; min-height:48px;}
.dtabs button.on{background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:600;}
.gallery{display:grid; grid-template-columns:1fr 1fr; gap:12px 9px; margin-top:14px;}
.gallery figure.work .ph{aspect-ratio:1/1;}
.bodytext{white-space:pre-wrap; font-size:16px; line-height:1.85; padding:12px 0; font-family:var(--serif);}
h3.subhead{font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:.14em; color:var(--muted); margin:22px 4px 0;}
h3.subhead:first-child{margin-top:8px;}
.tagline{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px;}
.tagline span{border:1px solid var(--line); background:var(--card); border-radius:999px; padding:3px 11px; font-size:12.5px;}
/* viewer */
#viewer{position:fixed; inset:0; background:#111; z-index:100; display:none; flex-direction:column;}
#viewer.open{display:flex;}
#viewer .vimg{flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden;}
#viewer .vimg img{max-width:100%; max-height:100%; object-fit:contain;}
#viewer .vimg .noimg{color:#888; font-family:var(--serif); letter-spacing:.2em;}
#viewer .vcap{color:#eee; font-size:14px; padding:10px 16px; line-height:1.6; font-family:var(--serif);}
#viewer .vbar{display:flex; justify-content:space-between; align-items:center; padding:8px 10px calc(8px + env(safe-area-inset-bottom));}
#viewer .vbar button{background:none; border:1px solid #555; color:#eee; padding:8px 18px; font-size:15px; border-radius:999px; min-height:48px;}
#viewer .vcount{color:#999; font-size:13px;}
/* exhibitions */
.exitem{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:12px;}
.exitem .et{font-family:var(--serif); font-size:16px; line-height:1.45;}
.exitem .em{font-size:13.5px; color:var(--muted); margin-top:2px;}
.exitem .edates{font-size:13.5px; margin-top:2px;}
.exitem .days{color:var(--accent); font-weight:600;}
button.linkbtn{background:none; border:none; color:var(--accent); font-size:13px; font-weight:600; padding:0 6px; min-height:48px; display:inline-flex; align-items:center;}
/* timeline / quiz */
.tlhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px;}
.tlhead h2{font-family:var(--serif); font-size:21px; margin:0; letter-spacing:.04em;}
.tlcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:12px;}
.tlbig{font-family:var(--serif); font-size:32px; line-height:1.1; letter-spacing:.02em;}
.tlyears{font-size:13px; color:var(--muted); letter-spacing:.06em; margin-top:2px;}
.tltitle{font-family:var(--serif); font-size:16.5px; margin-top:5px; line-height:1.5;}
.tlsum{font-size:15px; line-height:1.8; margin-top:8px; white-space:pre-wrap;}
.tlbg{font-size:14.5px; line-height:1.85; margin-top:10px; white-space:pre-wrap; border-top:1px solid var(--line); padding-top:10px;}
.tlchips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.tlchip{border:1px solid var(--line); background:var(--card2); border-radius:999px; padding:4px 12px; font-size:12px; color:var(--text); font-family:var(--sans);}
button.tlchip{color:var(--accent); font-weight:600; min-height:48px; display:inline-flex; align-items:center;}
.qcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 16px; margin-top:14px;}
.qq{font-family:var(--serif); font-size:17px; line-height:1.7; margin-top:6px;}
.qchoice{display:block; width:100%; text-align:left; background:var(--card2); border:1px solid var(--line); color:var(--text); padding:13px 15px; font-size:14.5px; border-radius:12px; margin-top:10px; font-family:var(--sans); min-height:56px;}
.qchoice.correct{border-color:var(--accent); background:var(--accent); color:var(--bg); font-weight:600;}
.qchoice.wrong{border-color:var(--danger); color:var(--danger);}
.qfeedback{font-size:14px; margin-top:14px; line-height:1.7;}
.qanswer{font-family:var(--serif); font-size:25px; line-height:1.4; margin-top:14px; letter-spacing:.03em;}
.qyears{font-size:13px; color:var(--muted); letter-spacing:.06em; margin-top:4px;}
.qbg{font-size:14.5px; line-height:1.85; margin-top:10px; white-space:pre-wrap; border-top:1px solid var(--line); padding-top:10px;}
.qmarkrow{display:flex; gap:8px; margin-top:16px;}
.qmarkrow button{flex:1; background:var(--card2); border:1px solid var(--line); color:var(--text); padding:13px 0; font-size:14px; border-radius:12px; font-family:var(--sans); letter-spacing:.06em; min-height:56px;}
.qmarkrow button.known{background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:600;}
/* forms / settings (diary .setgroup/.setbox/.btn) */
.setgroup{margin:24px 0;}
.setgroup > h3{font-family:var(--sans); font-size:13px; color:var(--muted); letter-spacing:.14em; font-weight:600; margin:0 4px 10px;}
.setbox{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;}
.setbox .blockbtn:first-child{margin-top:0;}
.setrow{margin-top:14px;}
.setrow:first-child{margin-top:0;}
.setlabel{font-size:13px; color:var(--muted); margin-bottom:6px; letter-spacing:.04em;}
input.textin, select.textin, textarea.textin{width:100%; background:var(--bg2); border:1px solid var(--lineStrong); padding:11px 12px; border-radius:10px; color:var(--text); outline:none; -webkit-appearance:none; font-size:16px;}
input.textin, select.textin{min-height:48px;}
textarea.textin{min-height:110px; line-height:1.7;}
.btn{display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:11px 20px; border-radius:999px; border:1px solid var(--line); background:var(--card2); color:var(--text); font-size:13.5px; margin:4px 6px 4px 0; font-family:var(--sans);}
.btn.primary{background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:600;}
.btn.danger{color:var(--danger); border-color:var(--danger); background:transparent;}
.btn:active{opacity:.75;}
.btn:disabled{opacity:.4;}
button.blockbtn{display:flex; align-items:center; justify-content:center; width:100%; min-height:56px; background:var(--card); border:1px solid var(--line); color:var(--text); padding:14px; font-size:14px; letter-spacing:.06em; margin-top:10px; border-radius:999px; font-family:var(--sans);}
button.blockbtn.primary{background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:600;}
button.blockbtn.danger{border-color:var(--danger); color:var(--danger); background:transparent;}
button.blockbtn:disabled{opacity:.4;}
.syncstat{font-size:14px; color:var(--muted); display:flex; flex-wrap:wrap; column-gap:10px; align-items:baseline;}
.syncstat .err{color:var(--danger);}
/* settings compaction (v2.14): one-row sync buttons, collapsible data mgmt */
.btnrow{display:flex; gap:8px;}
.btnrow .btn{flex:1 1 0; margin:0; padding-left:6px; padding-right:6px; white-space:nowrap;}
.setacc{border-radius:16px; padding:12px 16px;}
.setacc .tagnm{font-size:14px;}
#dmBody{margin-top:10px;}
.dmlabel{font-size:13px; font-weight:600; color:var(--text); letter-spacing:.08em; margin:16px 0 0;}
.note{font-size:14px; color:var(--muted); margin-top:8px; line-height:1.7;}
.workedit{border:1px solid var(--line); border-radius:14px; padding:12px; margin-top:10px; background:var(--bg2);}
.workedit .wr{display:flex; gap:6px; margin-top:6px;}
.workedit input{flex:1; min-width:0;}
.small{font-size:14px; line-height:1.75; color:var(--muted);}
#toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 112px); transform:translateX(-50%); background:var(--text); color:var(--bg); border-radius:999px; padding:10px 20px; font-size:13.5px; z-index:200; display:none; max-width:88vw; text-align:center;}
#toast.on{display:flex; align-items:center; gap:12px; text-align:left;}
#toastact{flex:none; min-height:48px; padding:0 18px; border:1px solid var(--bg); border-radius:999px; color:var(--bg); background:transparent; font-size:13.5px; font-weight:600; font-family:var(--sans);}
.fab{position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom, 0px) + 96px); z-index:40; width:60px; height:60px; border-radius:50%; background:var(--fab); color:var(--fabink); border:none; font-size:28px; line-height:1; box-shadow:0 6px 22px rgba(60,52,32,.35);}
.fab:active{transform:scale(.96);}
/* bottom pill navigation (ported from diary #pillnav: fixed height, glass, sliding indicator) */
#pillnav{position:fixed; left:50%; transform:translateX(-50%); z-index:40; bottom:calc(env(safe-area-inset-bottom, 0px) + 10px); width:calc(100vw - 92px); max-width:430px; height:56px; display:flex; gap:0; padding:3px; box-sizing:border-box; font-family:var(--sans); background:var(--nav); background:color-mix(in srgb, var(--nav) 55%, transparent); border:1px solid var(--line); border:1px solid color-mix(in srgb, var(--text) 13%, transparent); border-radius:999px; backdrop-filter:blur(18px) saturate(1.5); -webkit-backdrop-filter:blur(18px) saturate(1.5); box-shadow:0 10px 30px rgba(60,52,32,.35), inset 0 1px 0 rgba(255,255,255,.10), inset 0 -8px 16px rgba(255,255,255,.03);}
#navind{position:absolute; top:3px; bottom:3px; left:0; width:0; border-radius:999px; pointer-events:none; transform-origin:center; background:var(--card2); background:linear-gradient(180deg, color-mix(in srgb, var(--text) 21%, transparent), color-mix(in srgb, var(--text) 8%, transparent) 58%, color-mix(in srgb, var(--text) 13%, transparent)); border:1px solid color-mix(in srgb, var(--text) 16%, transparent); box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 -6px 10px rgba(255,255,255,.05), 0 2px 10px rgba(60,52,32,.20); will-change:transform;}
#pillnav button{position:relative; z-index:1; flex:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:0; border-radius:999px; font-size:12px; font-weight:500; color:var(--muted); white-space:nowrap; font-family:inherit; transition:color .3s;}
#pillnav svg{width:21px; height:21px;}
#pillnav button.on{color:var(--text); font-weight:600;}
/* press feedback (diary v1.16 style): subtle brightness shift only while pressed, no layout shift */
button:active:not(:disabled){filter:brightness(1.07);}
/* view transitions (v2.7): a view taken out of flow while it slides */
main.vt-fixed{position:fixed; left:0; right:0; width:100%; z-index:25; background:var(--bg); overflow:hidden; pointer-events:none; min-height:0;}
body.vt-run{overflow:hidden;}
/* ---------- opening (v2.11, replaces the v2.9 mist splash) ----------
   The user's final call on launch screens: a plain veil in the app's own
   ground colour that simply fades and reveals the UI — nothing else.
   No gradient/wash (tried and rejected), no logo, no fog, and no black:
   on this light-ground app a black veil would flicker light/dark, so the
   veil is --bg itself and the start reads as the screen quietly appearing.
   Fade .45s, the same value the diary app settled on. */
#veil{position:fixed; inset:0; z-index:300; background:var(--bg); animation:veilOut .45s cubic-bezier(0.2,0,0,1) .1s both;}
@keyframes veilOut{from{opacity:1;} to{opacity:0;}}
@media (prefers-reduced-motion: reduce){
  #veil{display:none !important;}
}
/* ---------- design-rule pass (v2.11) ----------
   Hit areas: every operable element reaches 48pt (primary actions 56pt)
   without disturbing the chosen visual density — small text buttons keep
   their glyphs and grow an invisible hit area instead. */
button.txtbtn{position:relative;}
button.txtbtn::after{content:''; position:absolute; left:0; right:0; top:-9px; bottom:-9px;}
.workedit .txtbtn{min-height:48px; display:inline-flex; align-items:center; padding:6px 12px;}
.workedit .txtbtn::after{content:none;}
.workedit input[type=file]{min-height:48px;}
.exitem a{display:inline-flex; align-items:center; min-height:48px;}
/* focus visibility + input boundaries (3:1) */
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
input.textin:focus, select.textin:focus, textarea.textin:focus, .searchrow input[type=search]:focus{border-color:var(--accent); box-shadow:0 0 0 2px rgba(87,80,62,.28);}
input::placeholder, textarea::placeholder{color:var(--muted); opacity:1;}
/* ---------- confirm dialog (v2.11): verb-labelled, undo-first policy ----------
   Destructive actions that cannot be undone ask here — never a bare
   "はい/いいえ". Cancel sits 16pt+ away from the destructive button and the
   sheet also closes via the visible x and the backdrop. */
#confirmdlg{position:fixed; inset:0; z-index:150;}
#confirmdlg .cd-backdrop{position:absolute; inset:0; background:var(--sheet);}
#confirmdlg .cd-sheet{position:absolute; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom, 0px) + 16px); max-width:640px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px 16px 16px; animation:cdIn .25s cubic-bezier(0.2,0,0,1) both;}
@keyframes cdIn{from{opacity:.3; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
#confirmdlg .cd-x{position:absolute; top:4px; right:4px; width:48px; height:48px; border-radius:50%; font-size:20px; line-height:1; color:var(--muted);}
#confirmdlg .cd-title{font-size:17px; font-weight:700; letter-spacing:.03em; padding-right:48px;}
#confirmdlg .cd-body{font-size:14.5px; line-height:1.75; margin-top:8px;}
#confirmdlg .cd-ok{display:flex; align-items:center; justify-content:center; width:100%; min-height:56px; margin-top:18px; border-radius:999px; background:var(--card2); border:1px solid var(--line); color:var(--text); font-size:15px; font-weight:600; font-family:var(--sans);}
#confirmdlg .cd-ok.danger{background:var(--danger); border-color:var(--danger); color:#fff;}
#confirmdlg .cd-cancel{display:flex; align-items:center; justify-content:center; width:100%; min-height:56px; margin-top:16px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--text); font-size:15px; font-family:var(--sans);}
@media (prefers-reduced-motion: reduce){
  #confirmdlg .cd-sheet{animation:none;}
}
.hidden{display:none !important;}
</style>

   "key_works": "丸亀市猪熊弦一郎現代美術館『中園孔二 ソウルメイト』（2025、過去最大の回顧展。絵画220点に加え、ノート・資料約70冊も展示された — ノート自体が作品資料として美術館に展示された前例）。",

   "name_native": "",
   "notes": "特徴：抽象的な色面で奥行きを制限し、人型などのモチーフを重層的に配置。「入れ子」構造 — 小さな顔やキャラクターが集まって大きな顔や景色になる。近くで見る像と遠くで見る像が入れ替わる。画材はクレヨン・油・インク、指やチューブ直付けなど多彩。\n内と外の理論（本人の言葉、2014年インタビュー映像より）：絵を描くことは「外縁をつくる」こと。中側はわからないし、見えないし、触れないから、外縁をつくって、中のことを「景色」と呼んでいるだけ。表面はばらばらでも「景色は一個」。たくさん外縁を作ることに意味があり、1個できたらカタチがあらわれる。何が描かれているかは重要ではなく、作品の外側こそ重要、という発言もある。別の言葉：「絵は、作者と作者と同じような人達とで作った、隣にある外」— 見ることは、となりで一緒に見てくれる誰かがいないと成立しない、というノートの記述（ソウルメイト論）につながる。\n一次資料：本人の文章インタビューはほぼ残っていない。中心資料は2014年のインタビュー映像（渋谷ヒカリエ／小山登美夫ギャラリー、監督・鈴木将也）で、YouTubeで閲覧可能。評伝：村岡俊也『穏やかなゴースト 画家・中園孔二を追って』（新潮社、2023、150冊のノートをもとに構成）。画集：『中園孔二 見てみたかった景色』（求龍堂、2018）。2018年横須賀美術館の初個展タイトル「外縁—見てみたかった景色」は本人の言葉から取られた。\n\n【来歴】\n1989年神奈川県横浜市生まれ。2012年東京藝術大学美術学部絵画科油画専攻を卒業し、同年「アートアワードトーキョー丸の内2012」で小山登美夫賞とオーディエンス賞を受賞。2013年に小山登美夫ギャラリーで個展を開き、2014年末に香川県へ移住したが、2015年に瀬戸内海沖で消息不明となり25歳で死去した。\n【技法・メディウム】\n主にキャンバスや紙に油絵具、クレヨンなど多様な画材を使い分けた。指で描く、チューブから直接絵具を付けるなどの方法を重ね、複数のレイヤーで画面を構成する即興的で身体的な描法が特徴である。",

   "name_latin": "Jorge Oteiza",
   "name_native": "",
   "notes": "【来歴】\n1908年スペイン・バスク地方ギプスコア県オリオ生まれ。マドリードで医学を3年学んだ後に工芸学校に短期間通い、ほぼ独学で彫刻を始めた。1935年から1948年まで南米に滞在して制作と陶芸教育に携わり、帰国後はアランツァスの聖堂彫刻などを手がけた。1957年サンパウロ・ビエンナーレで彫刻部門グランプリを受賞し、1959年に彫刻制作の終了を宣言した。\n【技法・メディウム】\n石、鉄、鋼などを素材に、鍛造と溶接で軽い幾何学的単位を組み合わせた。球・円柱・立方体などの量塊から物質を取り除く「脱占有（desocupación）」により、量塊そのものではなく残された空虚な空間を彫刻の中心とし、《形而上学的箱》に至った。",

   "notes": "【来歴】\n1954年インド・ムンバイ（ボンベイ）生まれ。1970年代初めにロンドンへ移り、ホーンジー・カレッジ・オブ・アート（1973–77年）とチェルシー・スクール・オブ・アート（1977–78年）で学んだ。1979年のインド再訪を機に粉末顔料の彫刻で注目され、1991年にターナー賞を受賞した。\n【技法・メディウム】\n初期は木・グラスファイバー・石膏を支持体に純色の粉末顔料をまとわせた形態を制作した。その後石灰岩・花崗岩・大理石などの石、鏡面に磨いたステンレス鋼、PVC、蝋などへ素材を広げ、内部の空洞＝「ヴォイド」や反射面で知覚を揺らす大規模作品を作る。",

   "updated_at": "2026-11-10T13:30:14.103Z",

   "name_latin": "Michael Heizer",
   "name_native": "",
   "notes": "【来歴】\n1944年アメリカ・カリフォルニア州バークレー生まれ。人類学者ロバート・ハイザーの子で、サンフランシスコ・アート・インスティテュートに1963–64年に短期間在籍した。1966年にニューヨークへ移った後、1967年からカリフォルニアやネバダの砂漠でアースワークを始め、1969年の《ダブル・ネガティブ》でランドアートの先駆者となった。1972年からネバダ州で巨大プロジェクト《シティ》を継続している。\n【技法・メディウム】\n重機で大地を掘削し、土や岩を移動・排除することで彫刻を作る。台地を切り取って作る溝のような「ネガティブ（負）」の形態を基本とし、土、岩、コンクリートなどを用いた場所固有で記念碑的規模の環境彫刻を制作する。",
   "relation": "『ダブル・ネガティブ』（1969）— 大地を切り取った「負の彫刻」をその名で宣言した作。彫刻を建築・地形スケールに拡大する時の参照。翔万の「でかくすれば建築になりそう」への回答例。",

   "notes": "【来歴】\n1942年埼玉県生まれ。多摩美術大学で斎藤義重に師事し、1968年に同大学大学院油画研究科を修了した。同年、神戸須磨離宮公園の第1回現代日本野外彫刻展で《位相—大地》を発表し、これが「もの派」誕生のきっかけとされる。1970年にヴェネチア・ビエンナーレに出品し、1973年に環境美術研究所を設立した。2019年没。\n【技法・メディウム】\n位相幾何学の発想を起点に、素材をできるだけ加工せず関係の中で示した。《位相—大地》では円柱形の穴を掘り、掘り出した土を同じ形の円柱に固めて隣に置き、《位相—スポンジ》では円筒形スポンジに鉄板を載せて変形を見せた。《空相》では鏡面ステンレスの柱の上に自然石を置くなど、土、石、金属、スポンジ、水などを用いた。",
   "relation": "『位相—大地』（1968）。地面に円柱の穴を掘り、掘り出した土の円柱を隣に置く。ネガとポジを対で提示したもの派の原点。日本の文脈で翔万の系譜を語る際の必須のアンカー。",

   "notes": "【来歴】\n1943年アメリカ・ロサンジェルス生まれ。1965年にポモナ・カレッジで知覚心理学と数学の学士号を取得し、その後カリフォルニア大学アーヴァイン校大学院を経てクレアモント大学院大学で芸術の修士号を得た。1966年に光による最初の作品《Afrum (Proto)》を発表し、南カリフォルニアの「ライト・アンド・スペース」の文脈で活動。1974年から《スカイスペース》を始め、アリゾナ州の火口を改変する生涯のプロジェクト《ローデン・クレーター》を続けている。\n【技法・メディウム】\n物体ではなく光そのものをメディウムとする。初期はプロジェクターで壁の隅に光を投影し、実体のように見える立方体などの錯覚を作った。《スカイスペース》は天井に開口部を切って空を切り取り、調整した人工光で空の色の知覚を変える建築的装置であり、《ガンツフェルト》では均一な色光で室内を満たし、奥行き知覚を失わせる。",
   "relation": "「量として作るのは外側、見えるのは奥の景色」の建築的実現。スカイスペースは、建物（外側）を作り、切り取られた空そのものを内容にする。ローデン・クレーターは火口を整形した生涯規模の作。",

   "notes": "【来歴】\n1941年大阪府生まれ。大学に進学せず、プロボクサーを経て独学で建築を学び、世界各地の建築を訪ねる旅を行った。1969年に安藤忠雄建築研究所を設立し、1976年の《住吉の長屋》で注目され、1979年に日本建築学会賞を受賞した。1995年にプリツカー賞を受賞し、1997年に東京大学教授に就任した。\n【技法・メディウム】\n仕上げを施さない打ち放しコンクリートを主素材とし、平滑な型枠による均質なコンクリート面と、箱や円などの単純な幾何学形態を特徴とする。《住吉の長屋》の中庭や《光の教会》の十字形スリットのように、開口部から光・風・雨などの自然を建築内部に引き込み、コンクリートの量塊と対比させる。",
   "relation": "『光の教会』（1989）。コンクリートの量塊に十字のスリット（空虚）を切り、光が内容になる。彫刻を建築スケールにした時、既に到達されている水準の例として。",

   "notes": "【来歴】\n1869年、北フランスのル・カトー＝カンブレジに生まれる。法律を学び事務員として働いた後、療養中に絵を描き始め画家を志し、パリでアカデミー・ジュリアンやギュスターヴ・モローの教室で学んだ。1905年のサロン・ドートンヌで強烈な色彩が「フォーヴ（野獣）」と評され、フォーヴィスムの中心となった。晩年は南仏を拠点にヴァンスのロザリオ礼拝堂なども手がけた。\n【技法・メディウム】\n主にカンヴァスへの油彩で、原色に近い強い色彩を平面的な色面とアラベスク的な輪郭で構成した。素描、版画、彫刻も手がける。1941年の手術後に身体の自由が制限されると、助手にグワッシュで塗らせた紙をハサミで切り抜いて貼る「切り紙絵（カットアウト）」を本格化し、著書『ジャズ』（1947）などに結実させた。",
   "relation": "色面そのもので形を作る平面絵画の正典。陰影による立体化を捨て、色の配置だけで空間を作る。晩年の切り絵は「描く」から「切って置く」への移行で、方法としても参考。",

   "notes": "【来歴】\n1885年、ニューヨーク州サンドバンク（現オルトマー）に生まれ、コネチカット州ハートフォードで育つ。工場などで働きながら1911年からコネチカット・リーグ・オブ・アート・スチューデンツ等で学んだ。1925年に結婚してニューヨークへ移り、マティスらの単純化された形と非自然主義的な色彩に触れて様式を変えた。特定の運動に属さず、後のカラーフィールドの画家たちにも影響を与えた。\n【技法・メディウム】\n主にカンヴァスへの油彩。当初はパレットナイフと筆による厚塗りの印象派風の画面だったが、1925年以降は顔料を薄く刷毛で塗る方法へ移行した。1944年頃からの成熟期は、細部を省いた平坦で大きな色面、薄く希釈した絵具の重ね、明暗の強い対比が特徴で、晩年は薄いウォッシュを重ねたヴェールのような色彩を用いた。版画ではモノタイプも制作した。",

   "notes": "【来歴】\n1927年、ニューヨーク・ブルックリンに生まれ、クイーンズで育つ。1946〜49年にクーパー・ユニオンで学び、1949年からスコーヒーガン絵画彫刻学校で奨学金を得て学び、戸外で実物を見て描く経験が決定的となった。1950年代以降、抽象表現主義の身振りに対抗する平坦な具象絵画を確立し、大規模な肖像画と風景画で知られる。2022〜23年にはグッゲンハイム美術館で大回顧展「Gathering」が開催された。\n【技法・メディウム】\n主に油彩。まずメゾナイト板などに小さい油彩スケッチを描き、鉛筆や木炭で詳細な素描を作り、それを拡大した原寸大下絵「カルトン」をパウンシング（小孔から粉状顔料を通して転写する技法）で大画面に移す。色はあらかじめ調合し、大作をウェット・オン・ウェットで一気に描き上げる。木やアルミニウム板を人物の形に切り抜いて両面に油彩を施す「カットアウト」も1959年頃から制作している。",

   "notes": "【来歴】\n1955年、アラバマ州バーミングハムに生まれ、幼少期にロサンゼルスへ移りワッツ／サウスセントラル地区で育つ。ロサンゼルスのオーティス美術学校（現オーティス・カレッジ）で1978年にBFAを取得した。ハーレムのスタジオ・ミュージアムのレジデンスを経て1987年にシカゴへ移住し、1993〜2006年イリノイ大学シカゴ校で教えた。1997年にマッカーサー・フェローシップを受賞し、2016年にはシカゴ現代美術館で大回顧展「Mastry」が開かれた。\n【技法・メディウム】\n代表作は、木枠に張らない大画面のカンヴァスへのアクリル絵画で、コラージュ、文字やサイネージ、グリッターなどを組み合わせる作品もある。人物の肌は極めて濃い、ほぼ黒の色で描かれ、粗い具象的リアリズムと高度に文様化された平面的な設定が併存する。後年にはファイバーグラスを支持体とするアクリル作品も制作している。",

   "notes": "【来歴】\n1970年、オハイオ州ユークリッドに生まれ、ロサンゼルスを拠点とする。1992年にロードアイランド・スクール・オブ・デザインでBFA、1994年にカリフォルニア芸術大学（CalArts）でMFAを取得した。1990年代半ばから発表を始め、2003年にはロサンゼルス現代美術館で当時最年少とされる回顧展が開かれた。\n【技法・メディウム】\nリネンやカンヴァスへの油彩、アクリル、フラッシュ（水性のビニル系絵具）を中心に、シルクスクリーンのインク、ジェッソ、木炭、コラージュなどを重ねる混合技法を用いる。デジタルで加工したイメージをシルクスクリーンで印刷する工程と、手描きの厚塗りやスプレー、刺繍的な要素などを同居させ、近年は粘土コート紙／壁紙を支持体にし、音や可動部分を含む作品もある。",

   "notes": "【来歴】\n1970年群馬県高崎市に生まれる。1994年に多摩美術大学絵画科日本画専攻を卒業した。2006年に大原美術館のアーティスト・イン・レジデンス「ARKO」で滞在制作し、2007年に香港のThe Sovereign Asian Art Prizeを受賞、2014年に第24回タカシマヤ美術賞を受賞した。2008年から翌年まで文化庁新進芸術家海外研修員としてデンマークに滞在し、現在は武蔵野美術大学教授を務める。\n【技法・メディウム】\n支持体は主に雲肌麻紙で、墨、青墨、胡粉、岩絵具、顔料などを用いる伝統的な日本画の素材による。一見勢いよく引かれた太い墨線は、面相筆による極細の線を何度も重ねて作られたもので、大胆な余白と最小限の彩色が対をなす。瞳や口元などは没骨を思わせるグラデーションで描写的に描かれ、国立美術館所蔵作では色鉛筆や鉛筆も併用されている。",

   "notes": "【来歴】\n1973年静岡県焼津市に生まれる。1992年に武蔵野美術大学造形学部視覚伝達デザイン学科に入学し、在学中の1995年に第6回グラフィックアート「3.3㎡（ひとつぼ）展」でグランプリを受賞した。卒業後も公募展で受賞を重ね、2001年にVOCA展奨励賞を受賞したが、2005年に踏切事故により31歳で死去した。没後、遺作集刊行や各地の美術館での回顧展により評価が高まった。\n【技法・メディウム】\n初期から中期の代表作は、板（ボード／イラストボード）にアクリル絵具で描かれ、東京国立近代美術館や静岡県立美術館の所蔵作も「アクリリック・板」と記録されている。人物と機械・日用品を一体化させたイメージを、イラストレーション的な平明さと細密な描写で構成した。2000年頃からはキャンヴァスに油彩へ移行し、塗り重ねが増えて表現が重層的になったとされる。",

   "notes": "【来歴】\n1902年香川県高松市に生まれる。1922年に東京美術学校西洋画科に入学して藤島武二に師事し、1926年に同校を中退、同年の第7回帝展に初入選した。1936年に小磯良平らと新制作派協会（現・新制作協会）を結成した。1938〜40年に渡仏し、ニースでマティスを訪ね指導を受けた。1955年から約20年間ニューヨークにアトリエを構えて抽象へ転じ、1991年に丸亀市猪熊弦一郎現代美術館が開館した。\n【技法・メディウム】\n洋画家として油彩を中心に制作し、初期の写実的な人物描写から、マティスの影響後は明るい色彩と大胆な描線へ変化した。ニューヨーク時代以降は、都市の景観などをモチーフに点と線による明快な構成の抽象絵画をカンヴァスに描いた。壁画、ステンドグラス、家具や包装紙などのデザインも手がけたことが美術館の略歴に記録されている。",

   "name_native": "",
   "notes": "【来歴】\n1870年フランス・グランヴィル生まれ。1888年にパリに出てアカデミー・ジュリアンとエコール・デ・ボザールに学び、セリュジエ、ボナール、ヴュイヤールらとナビ派の中心作家となった。1890年の論考で「絵画は本質的に、ある秩序で集められた色彩で覆われた平らな表面」と述べ、理論家としても知られる。篤いカトリック信仰から宗教画・壁画に取り組み、1919年にジョルジュ・デヴァリエールと聖なる芸術のアトリエを設立した。\n【技法・メディウム】\n油彩を中心に、輪郭を明確にし陰影と奥行きを抑えた平坦な色面で構成するクロワゾニスム／綜合主義的な手法を用いた。ほかにフレスコなどによる壁画、ステンドグラス、リトグラフ、木版、舞台装飾や挿絵も手がけた。",
   "relation": "作家というより理論の出典。1890年の定義：「絵画とは、戦場の馬や裸婦である前に、本質的に、ある秩序で集められた色彩で覆われた平面である」。平面性を絵画の本質として宣言した、最も有名な正当化の言葉。",
   "section": "言葉の側：理論・批評・現場の声",

   "notes": "【来歴】\n1969年スコットランド・ボーダーズのホーイック生まれ、グラスゴー在住・制作。マンチェスター・ポリテクニック、グレイズ・スクール・オブ・アート（アバディーン）で学び、1994–96年にロイヤル・カレッジ・オブ・アートで絵画の修士課程を修了した。2009年以降ロイヤル・スコティッシュ・アカデミー会員（Elect）。2023年にヘップワース・ウェイクフィールドで初の公立美術館個展を開催し、作品はテート等に収蔵されている。\n【技法・メディウム】\n二つの形式が軸で、大画面はカンヴァスにディステンパーと油彩、小画面は古いハードカバーの書籍の表紙に直接描く。2016年から本格化したディステンパーは顔料を兎膠などの膠で練る不透明でマットな画材で、染色、漂白による引き算、油彩やワニスの重層など版画的なレイヤー思考で制作する。",

   "notes": "【来歴】\n1760年江戸・本所割下水（現・墨田区亀沢付近）生まれ。十代で版木彫りを学んだ後、1778年に浮世絵師・勝川春章に入門し、翌年「勝川春朗」としてデビューした。勝川派を離れて読本挿絵、絵手本、摺物で活躍し、晩年に『冨嶽三十六景』等の風景版画で画境を開き、晩年は肉筆画にも力を入れて1849年に没した。\n【技法・メディウム】\n主軸は多色摺木版画の錦絵で、絵師・彫師・摺師・版元の分業により、一色ごとに版木を分けて和紙に摺り重ねる。輸入顔料ベロ藍（プルシアンブルー）をいち早く風景画に用いたことでも知られる。ほかに紙・絹に直接描く肉筆画、版本挿絵、絵手本がある。",

   "notes": "【来歴】\n1879年スイス・ベルン近郊ミュンヘンブーフゼー生まれ、音楽家の家庭に育つ。1898年からミュンヘンで学びフランツ・フォン・シュトゥックに師事、カンディンスキーらの「青騎士」に参加した。1914年のチュニジア旅行で色彩への転機を得て、1921–31年にバウハウスで教え、デュッセルドルフ美術アカデミーを経てナチスに解職されベルンに戻り、1940年に没した。\n【技法・メディウム】\n小画面の水彩・素描を中心に油彩、テンペラ等を併用し、紙、厚紙、布など多様な支持体を用いた。独自の「油彩転写（オイル・トランスファー）」では、油絵具やインクを塗った紙を介して線を転写し、上から水彩を加える。格子状に色を置く「魔方陣」的な色彩構成もバウハウス期の特徴である。",

   "notes": "【来歴】\n1889年スイス・ダボス生まれ。ザンクト・ガレンの工芸学校でテキスタイル・デザインを学び、ミュンヘンでも修業した。1916–29年にチューリヒ工芸学校で織物等を教え、チューリヒ・ダダに参加してジャン・アルプと出会い1922年に結婚した。ストラスブールではカフェ・ロベットの内装を手がけ、1930年代パリではCercle et Carré、Abstraction-Création等に参加、1943年にチューリヒで事故死した。\n【技法・メディウム】\n応用芸術の訓練を基盤に、テキスタイル（羊毛の刺繍・織物、ビーズワーク）、紙にグワッシュ、油彩、木のレリーフ／彫刻、マリオネット、家具、室内装飾まで領域横断的に制作した。織物の格子構造から出発した垂直・水平の幾何学構成と、円や半円を組み合わせた抽象が特徴である。",

   "notes": "【来歴】\n1866年モスクワ生まれ。モスクワ大学で法律と経済学を修めた後、1896年に画家を志してミュンヘンに移り、アジュベの画塾と美術アカデミーでシュトゥックに学んだ。1911年にフランツ・マルクらと「青騎士」を結成し『芸術における精神的なもの』を著した。第一次大戦でロシアに戻り、1922–33年にバウハウスで教え、閉鎖後はパリ近郊ヌイイに移住し1944年に没した。\n【技法・メディウム】\n油彩・カンヴァス／板を主軸に水彩も多い。初期の自由な色斑と線による「即興」、入念に構成した「コンポジション」という分類を自ら用いた。バウハウス期には円・直線・弧などの幾何学形態を定規的に配置する構成へ移り、パリ期には生物形態的な有機的形態が増える。",

   "notes": "【来歴】\n1941年アメリカ・インディアナ州フォートウェイン生まれ。ウィスコンシン大学マディソン校で数学・物理学と美術を学び、1966年にカリフォルニア大学デービス校でMFAを取得した。コンセプチュアル・アートの代表的作家とされ、1999年にヴェネチア・ビエンナーレで金獅子賞を受けた。\n【技法・メディウム】\n彫刻、写真、ネオン、ビデオ、ドローイング、版画、パフォーマンス、インスタレーションと媒体を限定せず、完成品より制作過程自体を重視する。初期には固定カメラの前で自らの身体による反復的な行為を長時間撮影し、言葉遊びを用いたネオン作品や、椅子の下の空間をコンクリートで型取りした作品《A Cast of the Space Under My Chair》（1965–68）などを制作した。",

   "notes": "【来歴】\n1968年群馬県高崎市生まれ。高校時代に交換留学生として渡米した。1994年にシアトルのコーニッシュ芸術大学でBFA、1999年にスコットランドのグラスゴー美術学校でMFAを取得し、アメリカを拠点に活動してきた。シアトル美術館などで個展を開いている。\n【技法・メディウム】\n「光と影で彫刻する」と自ら述べ、木、紙、布などの物体を単一の光源との関係で配置し、壁に落ちる影そのものを像とする作品で知られる。代表的シリーズ「Constellation」では、白く塗った木のパネルに多数の小さな釘（ブラッズ）を打ち、切れない一本の縫い糸を巻き付ける密度の差だけで肖像を描く。",

   "notes": "【来歴】\n本名アレクサンドル・ファルト（Alexandre Farto）、1987年リスボン生まれのポルトガル人作家。2000年代初頭にリスボンでグラフィティから活動を始め、ロンドンのバイアム・ショー美術学校／セントラル・セント・マーチンズで学んだ。2007年リスボン、2008年ロンドンのカンズ・フェスティバルで発表した「Scratching the Surface」が国際的な転機となり、2010年に自身のスタジオを設立した。\n【技法・メディウム】\n絵具を加えるのではなく表面を除去して像を作る「引き算」の手法が核。壁、看板、扉、金属、紙、木などをノミ、ドリル、エッチング、爆破などで切削・穿孔し、層を剥がして肖像などを現出させる。ステンシル、金属エッチング、映像、彫刻的インスタレーションも併用する。",

   "notes": "【来歴】\n1943年ニューヨーク生まれ、芸術家の両親のもとに育つ。コーネル大学で建築を学び1968年に卒業したが、通常の建築家としては活動せず「アナーキテクチャー」を掲げた。1970年代に解体予定の建物への介入で知られ、《Splitting》（1974）やパリの《Conical Intersect》（1975）などを制作。1978年、35歳で死去した。\n【技法・メディウム】\n代表作は「ビルディング・カット」。空き家や解体予定の建物の床・壁・天井の断片を鋸などで切り取り、建物を分割・開放して内部と外部の境界を崩す。作品自体は一時的で、主に写真・フィルムによる記録と切り取られた断片として残る。ドローイングも制作した。",

   "notes": "【来歴】\n1898年、オランダ・レーワルデン生まれ。デルフト工科大学を中途で離れ、1919年にハールレムの建築・装飾芸術学校へ入学、当初建築を学ぶが版画教師サミュエル・イェスルン・デ・メスキータの勧めで版画へ転じた。イタリア滞在とアルハンブラ宮殿のタイル模様の調査を経て、平面の規則分割や不可能図形で知られるようになり、1955年に騎士叙任、1965年にヒルフェルスム市文化賞を受けた。1972年死去。\n【技法・メディウム】\n木版画、リトグラフ、メゾチント、木口木版を中心とする版画家。木版は自ら摺ることも多く、多色木版では版木を分けて重ね摺りした。数学的な平面分割（テッセレーション）、無限、遠近法の反転、不可能な建築などを精密な版の線で構成した。",

   "notes": "【来歴】\n1913年、ニューヨーク州バッファロー生まれ。コロンビア大学で美術史を学び（1931–35年）、のちアメリカン・アーティスツ・スクールなどで絵画を学んだ。アメリカ抽象芸術家協会（AAA）に参加し、1946年以降ベティ・パーソンズ画廊で定期的に発表、1947年からブルックリン・カレッジで教えた。1967年に死去した。\n【技法・メディウム】\nキャンバスに油彩。晩年の「ブラック・ペインティング」では、一見一様な黒に見える正方形の画面を3×3の9区画に分け、黒に赤・緑・青などを微量に混ぜたほぼ黒の色面を重ねる。絵具をテレビン油に浸して油分（媒剤）を抜くことで筆触を消し、極めてマットなスエード状の表面を作った。",
   "relation": "絵画の中で「地が形を帯びる」をやった例外として追加（2026-11-09）。晩年の「黒い絵画」は真っ黒に近い地の中に、明度差わずかな十字形がゆっくり浮き出る。地が主役で、形は地の中から発見される。",

   "notes": "【来歴】\n1657年、フランス・リヨン生まれ、本名ジャン・トリュシェ。カルメル会修道士となりセバスチャンの名を名乗った。数学、水理学、グラフィックス、タイポグラフィに活動し、フランスの運河設計など水理学の専門家としても知られ、1699年にフランス王立科学アカデミーの名誉会員となった。1729年死去。\n【技法・メディウム】\n美術の技法ではなく、平面充填の方法として「トリュシェ・タイル」を考案した。正方形を対角線で二つの三角形に分け、一方を黒、他方を白としたタイルを用い、4通りの向きに回転させて組み合わせることで多様な模様を生成する。この組合せの研究を1704年の論文「Mémoire sur les combinaisons」に発表した。活字のポイント制や「ロマン・デュ・ロワ」書体にも関わった。",
   "relation": "作家ではなく方法の起源。マスの角に四分円を置く「トリュシェ・タイル」の考案者。翔万の言う「凹んだ直角三角形」はこのタイルの角の形（スパンドレル）と一致する。イスラム幾何学模様にも同じ形が出る。この単位形の呼び名は2026-11-09に「スパンドレル／三角小間」と決定（翔万命名）。",

   "notes": "【来歴】\n1976年東京都生まれ。1999年武蔵野美術大学造形学部油絵学科卒業、2001年同大学大学院修了、2005年京都市立芸術大学大学院博士後期課程修了。2010年五島記念文化賞美術新人賞により渡英、その後文化庁の研修で渡独し、東京とベルリンを拠点に活動する。\n【技法・メディウム】\n絵画の構造を解く方法として織物・刺繍に着目する。既存の織物から特定の色や縦糸・横糸だけを引き抜いて解体し、引き抜いた糸で再び織る・刺繍するなど、解体と再構築によって構造と歴史を可視化する。1997年よりこの手法を継続している。",

   "notes": "【来歴】\n1982年山形県生まれ。東京造形大学絵画科卒業。ラファエル・コランの『フロレアル』に自身の裸像を置き換えた《フロレアル（わたし）》（2004–07）などで注目され、黒田清輝作品に自身を重ねた自画像も発表する。2014年から相模原で私塾「パープルーム予備校」を主宰し、パープルーム／パープルームギャラリーの運営も行う。\n【技法・メディウム】\n細密な油彩による裸の自画像が代表的で、布・パネルに油彩で描かれる。ほかに真鍮筆・銀筆によるメタルポイント、台詞を伴うペン画ドローイングを初期からの表現方法とし、近年は映像、陶芸、版画、水彩・アクリルなどを交えたミクストメディアにも展開している。",

   "name_native": "Спартак Дерменджиев",
   "notes": "略歴：ソフィア生まれ、1982年国立美術アカデミー彫刻科卒、1985年からブルガリア美術家連合会員。具象彫刻・公共モニュメントが本業で、紙の裸婦素描「Venus - Muses」シリーズを長年描く。本人の素描サイト：parisdrawings.weebly.com\n\n【来歴】\n1954年ソフィア生まれ、芸名Paris（パリス）。1982年に国立美術アカデミー彫刻科を卒業し、1985年からブルガリア美術家連合（СБХ）会員。個展は約25回を数え、1998年に同連合の彫刻賞を受賞し、作品はブルガリア国立美術館やソフィア市立美術館などに収蔵されている。\n【技法・メディウム】\n具象彫刻と肖像彫刻を中心に、テラコッタ、ブロンズ、石膏などを用いる。等身大の石膏像やテラコッタの小彫刻などが確認できる。並行して紙のドローイングも継続的に制作・発表している（ドローイングの画材等の詳細は公的資料では未確認）。",

   "notes": "【来歴】\n2002年生まれのポーランドの画家。ワルシャワ美術アカデミー絵画科に在学し（HOS Gallery掲載時点で4年次）、2023/2024年にはライプツィヒ視覚芸術アカデミー（HGB）で学んだ。2025年にワルシャワのHOS Galleryのグループ展「Memory Palace」、ウィーン・コンテンポラリー（HOS Galleryブース）、ベルリンのPolish Art Week「Hardcore & Soul」等に参加した。\n【技法・メディウム】\n油彩・キャンバスが中心で、作品キャプションでも「olej na płótnie（油彩・キャンバス）」と明記される。本人インタビューによれば画面は少なくとも2層、多い場合は50層にもなり、白ではなく透明に下地処理した、黄みを帯びたキャンバスに描く「パリンプセスト」的な重ね方をする。音楽（楽譜）・数学・デジタル技術から借りたシステムと有機的形態、メモやテキストの断片を組み合わせる。",

   "name_native": "",
   "notes": "日本：棟方志功（独学で版画・絵画、ヴェネチア・ビエンナーレ最高賞）、中川一政（独学の洋画家）、松本竣介（美大なし、研究所と独学。夭折したが戦後日本の代表的画家）、横尾忠則（美大なし、グラフィックデザインから絵画へ）、五木田智央（美大なし、デザイン職を経て絵画）、ロッカクアヤコ（美大なし、指で描くスタイルで国際的市場成功）。\n海外：アンリ・ルソー（税関吏、独学の象徴）、フランシス・ベーコン（美術教育なし）、フリーダ・カーロ（独学）、バルテュス（アカデミー教育なし）、ジャン＝ミシェル・バスキア（美大なし、グラフィティから）。\n現代（存命・活動中）：ロッカクアヤコ、五木田智央、山口歴（美大なし、NYへ渡って独学）、草間彌生（京都市立美術専門学校に約1年在籍したのみで実質独学に近い）、Banksy（美術教育なし、グラフィティから）、Eddie Martinez（美術学校を中退し実質独学）、Javier Calleja（法学部卒、絵画は独学）。現代ではSNSが発表回路になり美大なしでも市場に直接出られるが、成功者はほぼ全員、早い段階でギャラリーやキュレーターという「他人の目」を獲得している——独学は孤学ではない。",
   "relation": "竹安佐和記の「成功してる絵描きで一番多いのは独学の人」というポストを受けて、翔万が具体名を求めたことで登録。美大・専門教育なし（または中退・研究所止まり）で画家として立った例。共通点は「学校の代替装置」を自前で持ったこと：批評の回路、発表の場、人脈と市場の接続。",

   "notes": "【来歴】\n1928年アメリカ・バージニア州レキシントン生まれ。ボストンの美術館付属美術学校、アート・スチューデンツ・リーグ・オブ・ニューヨークで学び、1951年夏にブラック・マウンテン・カレッジでフランツ・クラインやロバート・マザウェルらと出会い、ロバート・ラウシェンバーグとも親交を結んだ。1957年にローマへ移住し以後イタリアを拠点とし、1996年に高松宮殿下記念世界文化賞などを受賞、2011年にローマで死去した。\n【技法・メディウム】\n油彩、ハウスペイント、合成ポリマー絵具、鉛筆、ワックスクレヨンなどを大画面のキャンバスや紙に併用する。落書きのような書記的・カリグラフィックな線、掻き傷、消去、滴りを重ね、湿った絵具をパレットナイフや鉛筆で引っ掻く手法も特徴。神話・詩・古典古代への言及として単語、数字、詩句の断片を画面に書き込む。彫刻では石膏や木、鉄などの寄せ集めを白く塗る作品も制作した。",

   "notes": "【来歴】\n1958年ベルギー・モルツェル（アントウェルペン近郊）生まれ。1976年から美術を学び絵画に集中したが、1980年代初めに絵画への信頼を失い約2年間映画制作に転じた。1980年代半ばに絵画へ戻り、ホロコーストやベルギー領コンゴの政治など歴史的事件から日常的な事物までを扱う具象絵画で、絵画の再活性化を担う世代の中心的存在となった。2004年にTate Modernで大規模展が開催された。\n【技法・メディウム】\n油彩・キャンバス。写真、テレビ、映画のイメージや自らの写真・ドローイングを源泉とし、準備として多数のドローイング、水彩、コピーを重ねるが、最終の油彩画自体は1日で描き切る。色数を抑えた濁った淡い色調、濡れた絵具による素早い筆触が特徴で、意図的に焦点がぼけたように見える効果は拭き取りではなく筆で描いて作られる。映画由来のクロッピング、クローズアップ、フレーシング、シークエンスも導入する。",

   "notes": "【来歴】\n1900年アメリカ・ペンシルベニア州メリオン・スクエア生まれ。1921年にフィラデルフィア女子デザイン学校（現Moore College of Art & Design）に入学し1925年に卒業した。その後ニューヨークを拠点に、グリニッジ・ヴィレッジやスパニッシュ・ハーレムの隣人、家族、友人、芸術家らを描き続けた。抽象表現主義の時代にも具象の肖像画を貫き、評価が本格化したのは晩年で、2021年にはメトロポリタン美術館で大回顧展「People Come First」が開かれた。1984年ニューヨークで死去。\n【技法・メディウム】\n油彩・キャンバスを主とし、水彩やドローイングも残した。モデルを前に描く肖像画で、表現主義的な線と色彩、時に歪めた形態によって、外見の再現よりもモデルの心理や内面を捉えることを目指した。妊婦の裸体や80歳での裸体自画像のように、従来美化されなかった身体も率直に油彩で描いた。",

   "notes": "【来歴】\n1913年カナダ・モントリオールに、現在のウクライナから逃れたユダヤ人移民の子として生まれ（出生名Phillip Goldstein）、1922年にロサンゼルスへ移住した。オーティス美術学校に短期間通った以外はほぼ独学で、漫画、ルネサンス絵画、シュルレアリスム、メキシコ壁画に学んだ。1935年にPhilip Gustonへ改名しニューヨークへ移りWPAの壁画も手がけた。1950年代にはニューヨーク・スクールの抽象表現主義の主要画家となったが、1960年代末に具象へ転じ、1970年マールボロ画廊でのフード姿のKKKを描いた展覧会が大きな論議を呼んだ。1980年死去。\n【技法・メディウム】\n初期はフレスコ壁画、その後は油彩・キャンバス／パネルが中心。1950年代は形態が溶けるような抽象的筆触を用い、晩年は太く目立つ油彩の筆触と黒い輪郭線による漫画的で粗い造形に転じた。巨大な目、靴、脚の山、寝ている人物などの日常的で奇妙なモチーフを、ピンク・赤・黒・灰色系の画面に繰り返し描いた。",

   "notes": "【来歴】\n1901年スイス・ブレガリア渓谷のボルゴノーヴォに、ポスト印象派画家ジョヴァンニ・ジャコメッティの長男として生まれた。1922年にパリへ移り彫刻家アントワーヌ・ブールデルのもとで学び、シュルレアリスム彫刻の中心的存在となったが、1930年代半ばにモデルに向き合う制作へ戻りグループを離れた。第二次世界大戦中はジュネーヴに滞在し、1945年にパリへ帰還後、細長く引き伸ばされた人物像で知られるようになり、1962年にヴェネツィア・ビエンナーレ彫刻大賞を受賞した。1966年死去。\n【技法・メディウム】\n彫刻では手で捏ねて形作れる粘土や石膏で原型を作ることを好み、多くは後にブロンズ鋳造された。表面を執拗に触り直すため侵食されたように荒く、高度に質感のある肌が生まれ、歩く男、立つ裸婦、胸像という主題を繰り返した。絵画でも油彩による肖像画で、モデルを長時間前にして描いては消す加筆・修正を重ね、細い人物像と視線の再現を追求した。",

   "notes": "【来歴】\n1965年イギリス・ブリストル生まれ、リーズで育った。リーズのJacob Kramer College（1983–85年）で学んだ後、ロンドン大学ゴールドスミス・カレッジに1986–89年在学し、在学中の1988年に学生展「Freeze」を企画したことがYoung British Artists（YBAs）台頭の起点となった。1995年にターナー賞を受賞し、2012年にTate Modernで大回顧展が開催された。\n【技法・メディウム】\nコンセプチュアルな発想を優先し、アシスタントによる制作も公然と用いる。代表作は動物の死骸をホルムアルデヒド液に浸してガラスケースに展示する「Natural History」シリーズで、虎鮫や二分された牛と子牛などが知られる。他に、回転するキャンバスに家庭用ペイントを流すスピン・ペインティング、白地に色の円を規則的に並べ色を繰り返さないスポット・ペインティング、薬品棚（メディスン・キャビネット）、ダイヤモンドをちりばめたプラチナ鋳造の頭蓋骨など多岐にわたる。",

   "name": "サルバドール・ダリ",
   "name_latin": "Salvador Dalí",
   "name_native": "",
   "notes": "注意点：仮面が効いたのは背後に制作と技術があったからで、仮面自体が作品の代わりになったのではない。後年の Avida Dollars 化が制作そのものを痩せさせた面は、翔万にとっての反面教師として別途検討する価値がある。\n補足（ナゾロジー全3ページ確認、2026-11-09）：同記事が挙げる唯一の具体的な実験は着衣認知（enclothed cognition）の白衣実験（Adam & Galinsky, 2012）— 同じ白衣でも「医者の白衣」と言われた群の方が注意力が高かった、というもの。服や道具の象徴的意味が認知を変える、という点は翔万版の「仮面のスイッチを物に持たせる」設計に使える。一方、ダリの逸話・発言には記事内で一次資料の出典が示されておらず、演じる頻度・期間の検証可能な手順もない。合わない仮面を無理に続けると疲弊する、という記事自身の警告も重要。\n\n【来歴】\n1904年スペイン・カタルーニャのフィゲラス生まれ。1922年にマドリードのサン・フェルナンド王立美術アカデミーに入学し、学生寮で詩人フェデリコ・ガルシア・ロルカや映画監督ルイス・ブニュエルと交友したが、1926年に除籍された。同年パリでピカソに会い、1929年にシュルレアリスム・グループに加わった。《記憶の固執》（1931年）で知られ、1940–48年はアメリカに滞在、1989年にフィゲラスで死去した。\n【技法・メディウム】\n油彩・キャンバスを中心に、ヴェラスケスやフェルメールら古典巨匠に学んだ精緻で写実的な描法で、非合理な夢のイメージを描く。自ら提唱した「偏執狂的批判的方法」は、妄想状態を自ら誘発し連想によって一つの形態に別のイメージを重ねて見る二重像などを生む手順で、溶ける時計や松葉杖などのモチーフがその画面に現れる。",
   "relation": "Artist Labo 開設の日に翔万が持ってきたナゾロジー記事「ダリ・トリック」の中心人物。なりたい自分を演じることで理想に近づくという、ジョニー・トムソン（Big Think / Mini Philosophy）の命名した方法。三人称で「ダリは言う／ダリは考えない」と自分を語り、「天才ダリ」という仮面の後ろで最良の仕事をした、とトムソンは読む。ブルトンに付けられた侮蔑名 Avida Dollars（金に貪欲）を笑って自分の名前として採用し、起業家的人格として取り込んだ逸話も同記事の柱。",

   "notes": "【来歴】\n1973年中国山東省生まれ。山東芸術学院で学び1995年に卒業、北京の中央美術学院で彫刻を専攻し2001年に修士号を取得した。2005年11月に北京のアーティスト・ヴィレッジ索家村が取り壊され自らのスタジオを失ったことを契機に、同年から写真シリーズ『Hiding in the City（都市に隠れる）』を開始し、「透明人間（The Invisible Man）」として国際的に知られるようになった。\n【技法・メディウム】\nパフォーマンスと写真を組み合わせる。まず場所と背景を選び撮影構図を決めた上で、アシスタントらが劉本人の身体・顔・衣服に背景と全く同じ模様・色を手描きで施し、背景に溶け込ませる。本人は長時間静止したまま撮影され、デジタル合成ではなく身体へのペインティングそのものによって消える効果を作る。",
   "relation": "翔万が送った画像（警察官が半分黒・半分白の人物を掴む写真）の作者として、作者不詳からの自律調査で特定（2026-11-10）。作品は『People's Policeman No. 1』（人民警察 第1號、2006、Cプリント、M+ Sigg Collection 所蔵）。シリーズ『Hiding in the City（都市に隠れる）』は人物の身体に背景を描き込んで溶け込ませるカモフラージュ写真で知られる。本作は彫刻ではなく、身体に黒白を塗り分けた人物そのものを撮った写真——地（壁・制服）と図（身体）の境界を塗装でずらす、身体版の図地実験として翔万の方法と接続する。",
   "section": "地・ネガ・マスの系譜",

   "name_native": "",
   "notes": "【来歴】\n1955年東京都生まれ。1977年多摩美術大学彫刻科を中退し、1979年Bゼミスクールを修了した。1981年に初個展を開き、1982年パリ青年ビエンナーレに参加。2002年ヴェネツィア・ビエンナーレ第8回建築展で日本館ディレクターを務め、武蔵野美術大学客員教授など教育活動も行う造形作家・批評家である。\n【技法・メディウム】\n中心は、アクリル絵具の色斑を画面に配置した抽象絵画と、多様な素材による彫刻である。絵画ではマスキングによる形の反復・反転や、隣接する二画面の関係を用いる。立体では木、石膏、粘土、セラミック、ブロンズなどを駆使し、切り紙状のレリーフ・コンストラクション《あかさかみつけ》シリーズでも知られる。",
   "relation": "翔万が共有したXポスト（ことぶき／明源、2026-11-10）で言及されたことで登録。抽象絵画と美術理論の両方で戦う日本の代表的作家（『ルネサンス 経験の条件』『抽象の力』）。ポストの論点：欧州では「アジア人らしい問題を演じる」作家が受け、岡崎のような抽象的・哲学的な実践は伝わりにくかったのではないか／抽象はその土地に根付いて初めて機能するのであって、西洋圏にピンとこないものが生成されたと言うべき、という応答。国際的受容と「根付き」の問題の参照点。",
   "section": "日本の正典：古典〜現代",

   "key_works": "『OPERA』三部作（とくに OPERA III: ZOO “The Day of Heaven and Hell”、Lafayette Anticipations、2023）、《Parade》（2022）、《Legba》（2025）。画廊ページで画像・技法を確認できる作：《Mud field II》（2023）、《Rooted Coma》（2023）、《Inner Voices》（2022）、《Orfeo's heels》（2022）。",
   "name": "ポル・タブレ",
   "name_latin": "Pol Taburet",
   "name_native": "",
   "notes": "【来歴】1997年、パリ生まれ。グアドループ系の家系に育つ。パリ・セルジー国立高等美術学校（École Nationale Supérieure d'Arts de Paris-Cergy）卒。当初は陶芸を学び、絵画と彫刻へ移った。2020年に Balice Hertling（パリ）で初個展「OPERA I」、以後「OPERA II」（C L E A R I N G、ロサンゼルス、2021）、「OPERA III: ZOO “The Day of Heaven and Hell”」（Lafayette Anticipations、パリ、2023）と連作を展開。2022年、Reiffers Art Initiatives Prize（若手作家と文化的多様性のための賞）を受賞。作品はピノー・コレクション、Lafayette Anticipations、KADIST などに収蔵。取扱画廊は Balice Hertling、C L E A R I N G、Mendes Wood DM。【技法・メディウム】アクリル、油彩、アルコール系絵具にエアブラシを併用する。刷毛で置いた鮮やかな色面の地の上に、エアブラシで霧のように焦点の溶けた顔・手足を重ね、地（高解像度・平坦）と図（低解像度・幽霊的）の解像度差そのものを作る。主題は母・祖母から伝えられたグアドループのヴードゥー（カンボワ／Quimbois）の神話と口承文化、バロック絵画・宗教画、アメリカのトラップ音楽やホラー映画。",
   "relation": "翔万が名前を挙げた作家（2026-11-11）。「画廊とコレクションから作品を搾り取る」収集方針の第一号として登録。蛍光色に近い鮮やかな色面と、霧のように焦点の溶けた顔や手足を衝突させる。エアブラシによる顔の溶解は、クランストンで議論した「解像度の配分」をエアブラシ世代の方法でやっている例として、翔万の「一見なんなのかわからない絵」と絵の具感の参照になる。翔万の評（2026-11-11）：「現代のベーコンみたいな雰囲気」——歪んだ身体と不穏さの系譜。ただしベーコンの溶解が油彩を引きずる「肉」の側なのに対し、タブレの溶解はエアブラシの「霧」の側で、血の気が引いたデジタル時代の消え方をしている。",

function storeSet(k,v){ try{ localStorage.setItem(k,v); return true;}catch(e){ return false;}}
function storeGet(k){ try{ return localStorage.getItem(k);}catch(e){ return null;}}
function storeDel(k){ try{ localStorage.removeItem(k);}catch(e){}}
function sessSet(k,v){ try{ sessionStorage.setItem(k,v);}catch(e){}}
function sessGet(k){ try{ return sessionStorage.getItem(k);}catch(e){ return null;}}
function sessDel(k){ try{ sessionStorage.removeItem(k);}catch(e){}}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escA(s){ return esc(s);}
function toast(msg, ms){
const t=$('toast'); $('toastmsg').textContent=msg;
const act=$('toastact'); act.classList.add('hidden'); act.onclick=null;
t.classList.add('on');
clearTimeout(toast._tm); toast._tm=setTimeout(()=>{ t.classList.remove('on'); }, ms||2600);
}
/* destructive-but-recoverable actions report here: Undo stays up 6s (rules:
   >= 5s) and its button is a full 48pt target */
function toastUndo(msg, fn){
const t=$('toast'); $('toastmsg').textContent=msg;
const act=$('toastact'); act.classList.remove('hidden');
act.onclick=()=>{ clearTimeout(toast._tm); t.classList.remove('on'); if(fn) fn(); };
t.classList.add('on');
clearTimeout(toast._tm); toast._tm=setTimeout(()=>{ t.classList.remove('on'); }, 6000);
}
/* ---------- confirm dialog (v2.11): verb-labelled buttons, never はい/いいえ ---------- */
let cdResolve = null;
function confirmDialog(opts){
return new Promise(res=>{
cdResolve = res;
$('cdTitle').textContent = opts.title || '';
$('cdBody').textContent = opts.body || '';
const ok = $('cdOk');
ok.textContent = opts.okLabel || '削除する';
ok.classList.toggle('danger', opts.danger!==false);
$('confirmdlg').classList.remove('hidden');
});
}
function cdDone(v){
$('confirmdlg').classList.add('hidden');
if(cdResolve){ const r = cdResolve; cdResolve = null; r(!!v); }
}

function emptyData(){ return { kind: CONFIG.kind, version: 1, sections: [], artists: [], exhibitions: []};}
function normalizeData(d){
const out = emptyData();
if(!d || typeof d!=='object') return out;
if(Array.isArray(d.sections)) out.sections = d.sections.filter(x=>typeof x==='string');
if(Array.isArray(d.exhibitions)) out.exhibitions = d.exhibitions;
if(d.timeline && typeof d.timeline==='object' && !Array.isArray(d.timeline)) out.timeline = d.timeline;
if(Array.isArray(d.quiz)) out.quiz = d.quiz;
else if(d.quiz && typeof d.quiz==='object') out.quiz = d.quiz; /* {note, western[], japanese[]} flashcard shape */
const arr = Array.isArray(d.artists)? d.artists: (Array.isArray(d.items)? d.items: []);
out.artists = arr.map(normalizeArtist).filter(a=>a.name);
return out;
}
function normalizeImg(im){
if(!im || typeof im!=='object') return null;
const o = {};
if(im.fileId) o.fileId = String(im.fileId);
if(im.url) o.url = String(im.url);
return (o.fileId || o.url)? o: null;
}
function normalizeArtist(a){

name: String(a.name||''), name_latin: String(a.name_latin||''), name_native: String(a.name_native||''),
years: String(a.years||''), field: String(a.field||''), section: String(a.section||''),

/* works of an artist, representative first, deduped by union keys (fileId/url/file).
   The representative pseudo-work (work_image) must ABSORB the real work that
   carries the same file, adopting its img — otherwise an img-less representative
   shadows the image-carrying work as thumbnail / first plate / first viewer item. */
function worksOf(a){
const out = []; const seen = new Map();
const keysOf = (w)=>{
const ks = [ (w.img&&w.img.fileId), (w.img&&w.img.url), w.file ].filter(Boolean);
if(!ks.length && w.caption) ks.push('cap:'+w.caption);
return ks;
};
const push = (w)=>{
let ex = null;
keysOf(w).some(k=>{ if(seen.has(k)){ ex = seen.get(k); return true; } return false; });
if(ex){
/* same work in another representation: upgrade the kept entry in place */
if(!ex.img && w.img) ex.img = w.img;
else if(ex.img && w.img){
const m = Object.assign({}, w.img, ex.img);
if(!m.url && w.img.url) m.url = w.img.url;
if(!m.fileId && w.img.fileId) m.fileId = w.img.fileId;
ex.img = normalizeImg(m) || ex.img;
}
if(!ex.caption && w.caption) ex.caption = w.caption;
if(!ex.file && w.file) ex.file = w.file;
keysOf(w).forEach(k=>seen.set(k, ex));
return;
}
keysOf(w).forEach(k=>seen.set(k, w));
out.push(w);
};
if(a.work_image || a.work_caption) push({ caption:a.work_caption||'', file:a.work_image||'', img:null});
(a.works||[]).forEach(push);
return out;
}
function thumbOf(a){ const ws = worksOf(a); return ws.length? ws[0]: null;}

/* ---------- notes splitting (来歴 / 技法 / その他) ---------- */
function splitNotes(notes){
const res = { bio:'', tech:'', rest:''};
if(!notes) return res;
let cur = 'rest'; const buf = { bio:[], tech:[], rest:[]};
String(notes).split('\n').forEach(line=>{
const t = line.trim();
if(t==='【来歴】'){ cur='bio'; return;}
if(t==='【技法・メディウム】' || t==='【技法】'){ cur='tech'; return;}
buf[cur].push(line);
});
res.bio = buf.bio.join('\n').trim(); res.tech = buf.tech.join('\n').trim(); res.rest = buf.rest.join('\n').trim();
return res;
}

/* ---------- image resolution ---------- */
const driveImgCache = {}; /* fileId -> objectURL */
const localImgState = {}; /* element id counter */
let imgSeq = 0;
function localCandidates(file){
if(!file) return [];
if(/\.[a-zA-Z0-9]{2,5}$/.test(file)) return ['img/'+file];
return ['img/'+file+'.webp', 'img/'+file+'.jpg', 'img/'+file+'.jpeg', 'img/'+file+'.png'];
}
/* Size tiers for Drive thumbnails (v2.8): stored URLs are all sz=w1200, so
   small placements used to download full-size files. Rewrite the sz param per
   placement — list thumbnails w400 / detail plates w800 / viewer w1600. Only
   drive.google.com/thumbnail URLs are touched; anything else passes through. */
const IMG_SIZE = { thumb:400, plate:800, viewer:1600 };
function sizedThumbUrl(url, w){
const s = String(url||'');
if(!w || !/^https:\/\/drive\.google\.com\/thumbnail\?/.test(s)) return s;
if(/([?&])sz=[^&]*/.test(s)) return s.replace(/([?&])sz=[^&]*/, '$1sz=w'+w);
return s+'&sz=w'+w;
}
function imgHTML(work, size){
/* returns placeholder span; actual src set by hydrateImg (lazy).
   size rides on the span as data-size; hydrateImg reads it back.
   v2.18: the holder starts with a 図版 wordmark inside, so a plate whose
   image has not arrived yet is never a featureless blank; hydrateImg
   replaces the holder's content when the image (or the failure plate)
   lands. */
const id = 'im'+(++imgSeq);
const cap = work? (work.caption||''): '';
return '<span class="imgholder" id="'+id+'" data-cap="'+escA(cap)+'"'+(size? ' data-size="'+size+'"': '')+'"><span class="noimg">図版</span></span>';
}
function hydrateImg(span, work){
if(!span ||!work) return;
const cap = work.caption||'';
/* v2.18: failure adds .platefail (same box), NOT .noplate (shorter box) —
   see the CSS note. The tile keeps its exact geometry and shows the
   typographic plate instead. */
const fail = ()=>{ const ph = span.closest('.ph'); if(ph) ph.classList.add('platefail'); span.innerHTML = '<span class="noimg">図版<br>'+esc(cap.slice(0,40))+'</span>';};
if(work.img && work.img.fileId){
const fid = work.img.fileId;
if(driveImgCache[fid]){ span.innerHTML = '<img loading="lazy" src="'+driveImgCache[fid]+'" alt="'+escA(cap)+'">'; return;}
span.innerHTML = '<span class="noimg">図版 読込中</span>';
loadDriveImage(fid).then(url=>{
if(url){ span.innerHTML = '<img loading="lazy" src="'+url+'" alt="'+escA(cap)+'">';} else fail();
}).catch(fail);
return;
}
const tryLocal = ()=>{
const cands = localCandidates(work.file);
if(!cands.length){ fail(); return;}
/* NOTE: the <img> must be inserted into the document BEFORE setting src.
   A detached Image() with loading="lazy" never starts loading in Chrome/
   WebKit (lazy defers until the element is in the document near the
   viewport), so preload-then-append-on-load deadlocks: no request, no
   onload, no onerror — the plate stays empty forever. */
const im = document.createElement('img');
im.loading = 'lazy'; im.alt = cap;
let i = 0;
im.onerror = ()=>{ i++; if(i<cands.length){ im.src = cands[i];} else fail();};
span.innerHTML=''; span.appendChild(im);
im.src = cands[0];
};
if(work.img && work.img.url){
/* v2.20: retry the Drive URL with backoff before giving up on it.
   A single transient failure (burst throttling when a whole grid loads at
   once, an HTTP/2 reset, a momentary network drop) used to be permanent:
   onerror fell straight through to the local file candidates — which do
   not exist in the standalone app — and then to the failure plate, so one
   bad moment could plate every tile on screen (the "all photos gone"
   outage). The local fallback now runs only after the retries are
   exhausted, and fail() only after that. */
const wantSz = parseInt(span.getAttribute('data-size'), 10);
const fullUrl = sizedThumbUrl(String(work.img.url), isNaN(wantSz)? 0: wantSz);
const RETRY_WAITS = [350, 1000, 2200];
let attemptNo = 0;
const tryUrl = ()=>{
attemptNo++;
const uim = document.createElement('img');
uim.loading = 'lazy'; uim.alt = cap;
uim.onerror = ()=>{
if(attemptNo <= RETRY_WAITS.length && span.isConnected){
span.innerHTML = '<span class="noimg">図版</span>';
setTimeout(tryUrl, RETRY_WAITS[attemptNo-1] + Math.floor(Math.random()*250));
} else tryLocal();
};
span.innerHTML=''; span.appendChild(uim);
uim.src = fullUrl;
};
tryUrl();
return;
}
tryLocal();
}
const imgObserver = ('IntersectionObserver' in window)? new IntersectionObserver(entries=>{
entries.forEach(en=>{
if(en.isIntersecting){
const el = en.target; imgObserver.unobserve(el);
hydrateImg(el, el._work);
}
});
}, { rootMargin:'800px'}): null; /* v2.8: start loading well before the image scrolls into view */
function bindImages(scope){
(scope||document).querySelectorAll('.imgholder').forEach(span=>{
const holder = span.closest('[data-work]');
if(!holder) return;
const w = holder._work;
span._work = w;
if(imgObserver) imgObserver.observe(span); else hydrateImg(span, w);
});
}

/* ---------- views ---------- */
/* ---------- view transitions (v2.7) ----------
   Screen changes slide: forward = the new view slides in from the right while
   the old one parallaxes left; back = the reverse. Header and pill nav are
   shared chrome and never move. WAAPI-driven; a navigation requested mid-flight
   finishes the running transition instantly so state can never wedge. */
const VIEW_EL = { list:'viewList', detail:'viewDetail', ex:'viewEx', timeline:'viewTimeline', quiz:'viewQuiz', settings:'viewSettings' };
const VIEW_DEPTH = { list:0, detail:1, ex:1, timeline:1, settings:1, quiz:2 };
const VT_EASE = 'cubic-bezier(.32,.72,.24,1)';
/* VT_EASE is kept over the rulebook's stock curves on purpose: on full-screen
   slides its gentler attack reads as less "snappy" (the user's standing
   quality bar is absence of discomfort), it never overshoots, and durations
   stay inside the 300-500ms window. */
/* prefers-reduced-motion (v2.11): honoured by transitions, the swipe settle,
   the viewer sheet and the nav indicator — not only by the opening. */
const PRM_Q = (typeof window!=='undefined' && window.matchMedia)? window.matchMedia('(prefers-reduced-motion: reduce)'): null;
function reducedMotion(){ try{ return !!(PRM_Q && PRM_Q.matches); }catch(e){ return false; } }
let vtBusy = false, vtNoAnim = false, vtFinish = null, swipeSt = null, vtForceDir = 0;
function showView(v){
if(swipeSt && swipeSt.engaged){ const st = swipeSt; swipeSt = null; teardownSwipe(st, false); }
const prev = view;
if(vtBusy && vtFinish) vtFinish();
let dir = (VIEW_DEPTH[v]!=null && VIEW_DEPTH[prev]!=null)? Math.sign(VIEW_DEPTH[v]-VIEW_DEPTH[prev]): 0;
/* v2.18: same-depth switches (detail<->ex<->timeline<->settings) used to be
   instant cuts — the main source of the "バツッ" feel. They now slide too:
   depth decides when it can, otherwise a forced direction (dataset switch)
   or a plain forward slide. */
if(!dir && prev!==v) dir = vtForceDir || 1;
vtForceDir = 0;
const wantAnim = !vtNoAnim && prev!==v && !document.hidden && !reducedMotion();
view = v;
if(v!=='settings') CTX[DS].lastView = v;
$('fabAdd').classList.toggle('hidden', v!=='list');
$('navEx').classList.toggle('on', v==='ex');
$('navTimeline').classList.toggle('hidden', DS!=='artists');
$('navTimeline').classList.toggle('on', v==='timeline');
updatePill();
if(v==='list') renderList();
if(v==='ex') renderEx();
if(v==='timeline') renderTimeline();
if(v==='quiz') renderQuiz();
if(v==='settings'){ renderSyncStatus(); renderAbout(); }
moveNavInd(true);
const oldEl = prev? $(VIEW_EL[prev]): null, newEl = $(VIEW_EL[v]);
if(wantAnim && oldEl && newEl && oldEl!==newEl){
vtSlide(oldEl, newEl, dir);
} else {
Object.keys(VIEW_EL).forEach(k=>{ const el = $(VIEW_EL[k]); if(el) el.classList.toggle('hidden', k!==v); });
window.scrollTo(0,0);
}
pinNav(); setTimeout(pinNav, 350);
}
function vtSlide(oldEl, newEl, dir){
vtBusy = true;
const hdr = document.querySelector('header.top');
const H = hdr? hdr.offsetHeight: 0;
const y = window.scrollY || 0;
newEl.classList.remove('hidden');
document.body.classList.add('vt-run');
let aIn, aOut;
if(dir > 0){
/* v2.18: the outgoing view is ALSO pinned at its scrolled offset (the
   back branch already did this). It used to stay in flow while the code
   scrolled to 0, so a deep-scrolled list visibly teleported to its top
   in the first frame of the slide — a hard jolt inside the animation. */
oldEl.classList.add('vt-fixed');
oldEl.style.top = (H - y)+'px';
oldEl.style.height = '100dvh';
newEl.classList.add('vt-fixed');
newEl.style.top = H+'px';
newEl.style.height = 'calc(100dvh - '+H+'px)';
newEl.style.zIndex = '26';
aIn = newEl.animate([{ transform:'translateX(102%)' },{ transform:'translateX(0%)' }], { duration:330, easing:VT_EASE, fill:'both' });
aOut = oldEl.animate([{ transform:'translateX(0%)' },{ transform:'translateX(-26%)' }], { duration:330, easing:VT_EASE, fill:'both' });
window.scrollTo(0,0);
} else {
oldEl.classList.add('vt-fixed');
oldEl.style.top = (H - y)+'px';
oldEl.style.height = '100dvh';
window.scrollTo(0,0);
aIn = newEl.animate([{ transform:'translateX(-26%)' },{ transform:'translateX(0%)' }], { duration:310, easing:VT_EASE, fill:'both' });
aOut = oldEl.animate([{ transform:'translateX(0%)' },{ transform:'translateX(102%)' }], { duration:310, easing:VT_EASE, fill:'both' });
}
let done = false;
const finish = ()=>{
if(done) return; done = true;
[aIn, aOut].forEach(a=>{ try{ a.cancel(); }catch(e){} });
[oldEl, newEl].forEach(el=>{ el.classList.remove('vt-fixed'); el.style.top=''; el.style.height=''; el.style.transform=''; el.style.zIndex=''; });
oldEl.classList.add('hidden');
document.body.classList.remove('vt-run');
vtBusy = false; vtFinish = null;
pinNav();
};
vtFinish = finish;
Promise.all([aIn.finished.catch(()=>{}), aOut.finished.catch(()=>{})]).then(finish);
setTimeout(finish, 480);
}
/* ---------- pill nav indicator (diary moveNavInd) ---------- */
let lastNavX = null;
function moveNavInd(animate){
const ind = $('navind'); if(!ind) return;
const b = document.querySelector('#pillnav button.on'); if(!b) return;
const x = b.offsetLeft, w = b.offsetWidth;
if(!w) return;
ind.style.width = w+'px';
const from = lastNavX, to = x;
ind.style.transform = 'translateX('+to+'px)';
lastNavX = to;
if(animate && !reducedMotion() && from!==null && from!==to && ind.animate){
/* v2.11: the old cubic-bezier(.30,1.25,.35,1) overshot (a spring) — springs
   are reserved for finger-driven surfaces, so the indicator now uses the
   standard component curve at a component duration. */
ind.animate([
{ transform:'translateX('+from+'px)' },
{ transform:'translateX('+to+'px)' }
], { duration:300, easing:'cubic-bezier(0.2,0,0,1)' });
}
}
window.addEventListener('resize', ()=>{ moveNavInd(false); _sabCache = null; pinNav(); });
/* ---------- pill nav position pinning (diary v1.15 port) ----------
   iOS standalone shrinks the fixed-position frame on non-scrollable (short)
   pages, floating the bar up. Views are min-height:100dvh+1px so the page is
   always a hair scrollable; pinNav additionally measures the real gap to the
   screen bottom and compensates the bottom offset. */
let _sabCache = null;
function safeAreaBottom(){
if(_sabCache!=null) return _sabCache;
try{
const d = document.createElement('div');
d.style.cssText = 'position:fixed;left:0;bottom:0;width:0;height:0;padding-bottom:env(safe-area-inset-bottom, 0px);visibility:hidden;pointer-events:none;';
document.body.appendChild(d);
_sabCache = d.getBoundingClientRect().height || 0;
d.remove();
}catch(e){ _sabCache = 0; }
return _sabCache;
}
/* v2.18 hardening: the compensation now covers the fab as well as the pill
   (both ride the same fixed frame), and a measurement is only APPLIED when
   it is plausible. Mid-scroll / mid-resize readings on iOS can be off by
   hundreds of px; the old code persisted whatever it measured, which could
   bake a huge bottom offset into the bar and leave it floating mid-screen
   until the next clean measurement. Implausible readings are dropped and
   re-measured once scrolling settles (scroll-end re-pin below, plus the
   retry timer). Measurements are also skipped mid-transition — the
   transition's own finish re-pins. */
let pinRetryT = null;
function pinNav(){
const nav = $('pillnav'); if(!nav) return;
if(document.body.classList.contains('vt-run')) return;
const fab = $('fabAdd');
nav.style.bottom = 'calc(env(safe-area-inset-bottom, 0px) + 10px)';
if(fab) fab.style.bottom = '';
const gap = window.innerHeight - nav.getBoundingClientRect().bottom;
const want = safeAreaBottom() + 10;
const delta = want - gap;
if(Math.abs(delta) <= 2) return;
if(Math.abs(delta) > 60){
if(pinRetryT) clearTimeout(pinRetryT);
pinRetryT = setTimeout(()=>{ pinRetryT = null; pinNav(); }, 350);
return;
}
nav.style.bottom = 'calc(env(safe-area-inset-bottom, 0px) + ' + (10 + delta).toFixed(1) + 'px)';
if(fab) fab.style.bottom = 'calc(env(safe-area-inset-bottom, 0px) + ' + (96 + delta).toFixed(1) + 'px)';
}
let pinScrollT = null;
window.addEventListener('scroll', ()=>{
if(pinScrollT) clearTimeout(pinScrollT);
pinScrollT = setTimeout(()=>{ pinScrollT = null; pinNav(); }, 160);
}, { passive:true });
if(window.visualViewport) window.visualViewport.addEventListener('resize', ()=>pinNav());
document.addEventListener('touchstart', function(){}, { passive:true }); /* enables :active press feedback on iOS */
function updatePill(){
$('pnArtists').classList.toggle('on', DS==='artists' && view!=='settings');
$('pnDesigners').classList.toggle('on', DS==='designers' && view!=='settings');
$('pnSet').classList.toggle('on', view==='settings');
}

/* ---------- dataset switching （ページ遷移なし・文脈はデータセット毎に保持） ---------- */
function switchDataset(kind){
if(kind===DS){ showView('list'); return; }
/* 切替は常時自由：同期はデータセット文脈を掴んで走るため、表示側の切替と干渉しない */
if(view==='list') CTX[DS].scrollY = window.scrollY;
const prevV = view;
const srcDest = (view==='settings')? 'settings': DS;
stashCtx();
DS = kind; bindCtx();
editWorks = [];
updateHeader(); updatePill();
let v = (view==='settings')? 'list': (CTX[DS].lastView || 'list');
if(v==='ex' && DS!=='artists') v = 'list';
if((v==='timeline' || v==='quiz') && DS!=='artists') v = 'list';
if(v==='detail' && !artistById(state.detailId)) v = 'list';
if(v==='settings') v = 'list';
/* v2.18: dataset switches used to be forced instant (vtNoAnim) — another
   hard cut. They now take the view slide, directed by the pill order.
   When the target is the SAME view element (list->list, detail->detail:
   both datasets share the <main>), no two-view slide is possible, so the
   re-rendered content instead enters with a short directional drift —
   a nudge in the travel direction rather than a teleport. */
const DS_ORDER = ['artists','designers','settings'];
const dsDir = Math.sign(DS_ORDER.indexOf(kind) - DS_ORDER.indexOf(srcDest)) || 1;
vtForceDir = dsDir;
showView(v);
if(v==='detail') renderDetail();
if(v===prevV && !reducedMotion()){
const el = $(VIEW_EL[v]);
if(el && el.animate){
try{ el.animate([{ transform:'translateX('+(dsDir*22)+'px)', opacity:'0.3' },{ transform:'translateX(0px)', opacity:'1' }], { duration:260, easing:VT_EASE }); }catch(e){}
}
}
if(v==='list' && CTX[DS].scrollY){ const y = CTX[DS].scrollY; requestAnimationFrame(()=>window.scrollTo(0,y)); }
pinNav();
}

/* ---------- exhibitions （作家：並び替え付き） ---------- */
let exSortMode = 'start'; /* 'start' = 開始日順 / 'end' = 終了が早い順 / 'near' = 近い順 */
let exUserPos = null, exGeoState = 'idle'; /* idle | asking | ok | denied */
function exCoords(e){
  const lat = (e.lat!=null && e.lat!=='')? e.lat: e.latitude;
  const lng = (e.lng!=null && e.lng!=='')? e.lng: e.longitude;
  if(lat==null || lng==null) return null;
  const la = parseFloat(lat), ln = parseFloat(lng);
  if(isNaN(la) || isNaN(ln)) return null;
  return { lat: la, lng: ln };
}
function exDistKm(e){
  if(!exUserPos) return null;
  const c = exCoords(e); if(!c) return null;
  const R = 6371, dLa = (c.lat-exUserPos.lat)*Math.PI/180, dLn = (c.lng-exUserPos.lng)*Math.PI/180;
  const h = Math.sin(dLa/2)*Math.sin(dLa/2) + Math.cos(exUserPos.lat*Math.PI/180)*Math.cos(c.lat*Math.PI/180)*Math.sin(dLn/2)*Math.sin(dLn/2);
  return 2*R*Math.asin(Math.sqrt(h));
}
function exSortCmp(mode){
  if(mode==='end') return (a,b)=>{ const ea = a.end_date||'9999-99-99', eb = b.end_date||'9999-99-99'; return ea<eb? -1: (ea>eb? 1: 0); };
  if(mode==='near') return (a,b)=>{ const da = exDistKm(a), db = exDistKm(b); if(da==null && db==null) return 0; if(da==null) return 1; if(db==null) return -1; return da-db; };
  return (a,b)=>{ const sa = a.start_date||'9999-99-99', sb = b.start_date||'9999-99-99'; return sa<sb? -1: (sa>sb? 1: 0); };
}
function setExSort(m){
  exSortMode = m;
  if(m==='near' && !exUserPos && exGeoState!=='denied'){
    if(navigator.geolocation){
      exGeoState = 'asking';
      navigator.geolocation.getCurrentPosition(
        function(p){ exUserPos = { lat: p.coords.latitude, lng: p.coords.longitude }; exGeoState = 'ok'; renderEx(); },
        function(){ exGeoState = 'denied'; renderEx(); },
        { timeout: 10000, maximumAge: 600000 });
    } else exGeoState = 'denied';
  }
  renderEx();
}

const effMode = (exSortMode==='near' && !exUserPos)? 'start': exSortMode;
const cmp = exSortCmp(effMode);

const cur = exs.filter(e=>e.status==='current' || (e.start_date<=tstr && (!e.end_date || e.end_date>=tstr))).sort(cmp);

if(up.length) html += '<h2 class="sechead"><span>近日開催</span><span class="cnt">'+up.length+'件</span></h2>' + up.map(item).join('');

/* ---------- quiz （DB.quiz・2 系統の形状に対応） ----------
   A) flashcard shape (migration の実データ): quiz = { note, western:[{question, answer, years, background}], japanese:[...] }
      question = 説明文、answer = 様式名（文字列）。選択肢はないので単語カード式にする。
   B) multiple-choice shape: quiz = [ {q, choices[], answer} | {question, options[], correct_index} ]（v2.1 互換） */
function quizHasData(q){
if(Array.isArray(q)) return q.length>0;
if(q && typeof q==='object'){
return ['western','japanese'].some(k=>Array.isArray(q[k]) && q[k].some(it=>it && typeof it.question==='string' && it.question && typeof it.answer==='string' && it.answer));
}
return false;
}
function quizChoiceItems(){
const q = DB && DB.quiz;
if(!Array.isArray(q) || !q.length) return null;
const out = [];
q.forEach(it=>{
if(!it || typeof it!=='object') return;
const text = (typeof it.q==='string' && it.q)? it.q: ((typeof it.question==='string' && it.question)? it.question: '');
const choices = Array.isArray(it.choices)? it.choices: (Array.isArray(it.options)? it.options: null);
if(!text || !choices || choices.length<2) return;
let ans = -1;
if(typeof it.correct_index==='number') ans = it.correct_index;
else if(typeof it.answer==='number') ans = it.answer;
else if(typeof it.answer==='string'){
const ix = choices.indexOf(it.answer);
if(ix>=0) ans = ix;
else { const n = parseInt(it.answer,10); if(!isNaN(n)) ans = n; }
}
if(ans<0 || ans>=choices.length) return;
out.push({ q:text, choices:choices.map(String), answer:ans });
});
return out.length? out: null;
}
let qzRegion = 'west'; /* 'west' | 'japan' （quiz.western / quiz.japanese に対応） */
function quizCardItems(region){
const q = DB && DB.quiz;
if(!q || Array.isArray(q) || typeof q!=='object') return null;
const arr = q[(region||qzRegion)==='west'? 'western': 'japanese'];
if(!Array.isArray(arr)) return null;
const out = [];
arr.forEach(it=>{
if(!it || typeof it!=='object') return;
if(typeof it.question!=='string' || !it.question) return;
if(typeof it.answer!=='string' || !it.answer) return;
out.push({ question:it.question, answer:it.answer, years:String(it.years||''), background:String(it.background||'') });
});
return out.length? out: null;
}
function quizHasCards(){
const q = DB && DB.quiz;
if(!q || Array.isArray(q) || typeof q!=='object') return false;
return !!quizCardItems('west') || !!quizCardItems('japan');
}
function quizAvailable(){ return !!quizChoiceItems() || quizHasCards(); }
let quizState = null; /* cards: {mode:'cards', items, idx, known, revealed} / choice: {mode:'choice', items, idx, score, picked, answered} */
function startQuiz(){
const cards = quizCardItems(qzRegion);
if(cards){ quizState = { mode:'cards', items:cards, idx:0, known:0, revealed:false }; showView('quiz'); return; }
if(quizHasCards()){ /* 選択中の地域にカードが無ければ、ある方の地域で始める */
qzRegion = quizCardItems('west')? 'west': 'japan';
quizState = { mode:'cards', items:quizCardItems(qzRegion), idx:0, known:0, revealed:false }; showView('quiz'); return;
}
const items = quizChoiceItems();
if(items){ quizState = { mode:'choice', items:items, idx:0, score:0, picked:-1, answered:false }; showView('quiz'); return; }
toast('クイズデータはまだありません');
}
function setQuizRegion(r){
qzRegion = r;
const cards = quizCardItems(r);
quizState = { mode:'cards', items:cards||[], idx:0, known:0, revealed:false };
renderQuiz();
}
function revealCard(){ if(quizState && quizState.mode==='cards') quizState.revealed = true; renderQuiz(); }
function markCard(known){
if(!quizState || quizState.mode!=='cards' || !quizState.revealed) return;
if(known) quizState.known++;
quizState.idx++; quizState.revealed = false;
renderQuiz();
}
function answerQuiz(i){
if(!quizState || quizState.mode!=='choice' || quizState.answered) return;
quizState.picked = i; quizState.answered = true;
if(i === quizState.items[quizState.idx].answer) quizState.score++;
renderQuiz();
}
function nextQuiz(){
if(!quizState || quizState.mode!=='choice') return;
quizState.idx++; quizState.picked = -1; quizState.answered = false;
renderQuiz();
}
function renderQuiz(){
const v = $('viewQuiz'); if(!v) return;
const s = quizState;
if(!s){ v.innerHTML = '<div class="tlhead"><h2>クイズ</h2><span class="topsp"></span><button class="txtbtn" onclick="showView(\'timeline\')">← 年表</button></div><div class="empty">クイズデータはまだありません</div>'; return; }
if(s.mode==='cards'){
const total = s.items.length;
let html = '<div class="tlhead"><h2>クイズ</h2><span class="topsp"></span>'
+'<button class="txtbtn" onclick="showView(\'timeline\')">← 年表</button>'
+'<span class="seg"><button class="'+(qzRegion==='west'?'on':'')+'" onclick="setQuizRegion(\'west\')">西洋</button>'
+'<button class="'+(qzRegion==='japan'?'on':'')+'" onclick="setQuizRegion(\'japan\')">日本</button></span></div>';
if(!total){ v.innerHTML = html + '<div class="empty">この地域のクイズはまだありません</div>'; return; }
if(s.idx >= total){
v.innerHTML = html + '<div class="qcard"><div class="qq">わかった '+s.known+'問 ／ 全'+total+'問</div>'
+'<div class="qfeedback">'+(s.known===total? '全問わかりました。': (s.known*2>=total? 'よくできました。': 'おつかれさまでした。'))+'</div>'
+'<button class="blockbtn primary" onclick="startQuiz()">もう一度</button>'
+'<button class="blockbtn" onclick="showView(\'timeline\')">年表へ戻る</button></div>';
return;
}
const it = s.items[s.idx];
html += '<div style="margin-top:10px;"><span class="small">第'+(s.idx+1)+'問 ／ 全'+total+'問</span></div>';
html += '<div class="qcard"><div class="qq">'+esc(it.question)+'</div>';
if(!s.revealed){
html += '<button class="blockbtn primary" onclick="revealCard()">答えを見る</button>';
} else {
html += '<div class="qanswer">'+esc(it.answer)+'</div>'
+(it.years? '<div class="qyears">'+esc(it.years)+'</div>': '')
+(it.background? '<div class="qbg">'+esc(it.background)+'</div>': '')
+'<div class="qmarkrow"><button class="known" onclick="markCard(true)">わかった</button>'
+'<button onclick="markCard(false)">わからなかった</button></div>';
}
html += '</div>';
v.innerHTML = html;
return;
}
/* multiple-choice mode (v2.1 shapes) */
const total = s.items.length;
if(s.idx >= total){
v.innerHTML = '<div class="tlhead"><h2>クイズ</h2><span class="topsp"></span><button class="txtbtn" onclick="showView(\'timeline\')">← 年表</button></div>'
+'<div class="qcard"><div class="qq">'+total+'問中 '+s.score+'問 正解</div>'
+'<div class="qfeedback">'+(s.score===total? '全問正解です。': (s.score*2>=total? 'よくできました。': 'おつかれさまでした。'))+'</div>'
+'<button class="blockbtn primary" onclick="startQuiz()">もう一度</button>'
+'<button class="blockbtn" onclick="showView(\'timeline\')">年表へ戻る</button></div>';
return;
}
const it = s.items[s.idx];
let html = '<div class="tlhead"><h2>クイズ</h2><span class="topsp"></span><button class="txtbtn" onclick="showView(\'timeline\')">← 年表</button><span class="small">第'+(s.idx+1)+'問 ／ 全'+total+'問</span></div>';
html += '<div class="qcard"><div class="qq">'+esc(it.q)+'</div>';
it.choices.forEach((c,i)=>{
let cls = 'qchoice';
if(s.answered){ if(i===it.answer) cls += ' correct'; else if(i===s.picked) cls += ' wrong'; }
html += '<button class="'+cls+'"'+(s.answered?' disabled':'')+' onclick="answerQuiz('+i+')">'+esc(c)+'</button>';
});
if(s.answered){
const ok = s.picked === it.answer;
html += '<div class="qfeedback">'+(ok? '正解！': '不正解。正解は「'+esc(it.choices[it.answer])+'」です。')+'</div>'
+'<button class="blockbtn primary" onclick="nextQuiz()">'+(s.idx+1>=total? '結果を見る': '次へ')+'</button>';
}
html += '</div>';
v.innerHTML = html;
}

function fileBase(name){ return String(name||'').replace(/^.*[\\/]/,'').replace(/\.[a-zA-Z0-9]{2,5}$/,'');}

savePendingImages();

};
rd.readAsDataURL(f);

}

}

});
if(rec.section && DB.sections.indexOf(rec.section)<0) DB.sections.push(rec.section);
